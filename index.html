<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#006935">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>Velten Scan</title>
<style>  :root {

    --gruen:#006935; --hell:#8EC31F; --rot:#E60013;
    --bg:#ffffff; --panel:#f4f6f4; --line:#dfe4e0; --text:#14211b; --dim:#6b7a72;
    --ok:#006935; --warn:#8f5700; --bad:#E60013; --accent:#006935;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none; }
  body { display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0); }

  header { display:flex; align-items:center; gap:8px; padding:7px 10px;
    background:var(--gruen); flex:0 0 auto; }
  #logo { height:30px; width:auto; flex:0 0 auto; display:block; }
  header .sp { flex:1; }
  .tag { font-size:12px; padding:3px 8px; border-radius:99px;
    background:rgba(255,255,255,.18); color:#fff; }
  .tag:empty { display:none; }
  .tag.on { background:var(--hell); color:var(--gruen); font-weight:700; }
  .tag.off { background:var(--rot); color:#fff; font-weight:700; }
  #lang { font-size:12px; font-weight:700; color:#fff; background:rgba(255,255,255,.18);
    border:0; border-radius:99px; padding:5px 10px; }
  #gear { border:0; background:transparent; color:#fff; font-size:18px; padding:2px 4px; }

  #flash { flex:0 0 auto; padding:14px 10px; text-align:center; background:var(--panel);
    border-bottom:1px solid var(--line); color:var(--text); }
  #flash .a { font-size:26px; font-weight:800; line-height:1.15; word-break:break-word; }
  #flash .b { font-size:14px; opacity:.9; margin-top:2px; }
  #flash .b:empty { display:none; }
  #flash.ok { background:var(--ok); color:#fff; }
  #flash.warn { background:var(--warn); color:#fff; }
  #flash.bad { background:var(--bad); color:#fff; }

  nav { display:flex; flex:0 0 auto; background:var(--bg); border-bottom:1px solid var(--line); }
  nav button { flex:1; padding:11px 2px; border:0; background:transparent; color:var(--dim);
    font-size:15px; font-weight:600; border-bottom:3px solid transparent; }
  nav button.sel { color:var(--text); border-bottom-color:var(--accent); }

  main { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; }
  .hide { display:none !important; }

  .cam { position:relative; background:#000; border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .cam video { width:100%; max-height:34vh; display:block; object-fit:cover; }
  .cam .fr { position:absolute; inset:20% 6%; border:2px solid rgba(255,255,255,.9); border-radius:6px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.3); pointer-events:none; }
  .cam .fr::after { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#e53e3e; }

  .two { display:flex; gap:8px; }
  button.b { flex:1; padding:14px 8px; font-size:16px; font-weight:700; border:0; border-radius:10px;
    background:var(--accent); color:#fff; }
  button.b.g { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  button.b.w { width:100%; }
  input { width:100%; padding:13px; font-size:17px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); margin-top:8px; }
  #cfgCode { font-size:30px; text-align:center; letter-spacing:8px; font-weight:800;
    text-transform:uppercase; font-family:ui-monospace,Menlo,monospace; }

  .big { font-size:32px; font-weight:800; text-align:center; padding:16px 8px;
    background:var(--panel); border:2px solid var(--gruen); border-radius:10px;
    margin:10px 0 8px; word-break:break-word; color:var(--gruen); }
  .sscc { font-family:ui-monospace,Menlo,monospace; font-size:15px; text-align:center;
    color:var(--dim); letter-spacing:1px; }
  .row { display:flex; align-items:center; gap:8px; padding:10px; background:var(--panel);
    border:1px solid var(--line); border-radius:9px; margin-top:6px; font-size:15px; }
  .row .g { flex:1; min-width:0; }
  .row .m { font-family:ui-monospace,Menlo,monospace; }
  .row .s { color:var(--dim); font-size:13px; }
  .row .x { color:var(--dim); font-size:22px; padding:0 6px; }
  .hint { font-size:12px; color:var(--dim); margin-top:4px; min-height:16px; }
  .lbl { font-size:12px; color:var(--dim); margin-top:10px; }

  .chk { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:15px; }
  .chk input { width:22px; height:22px; margin:0; flex:0 0 auto; accent-color:var(--gruen); }

  .row.alt { border-left:4px solid var(--gruen); }

  @keyframes spin { to { transform:rotate(360deg); } }
  .spin { display:inline-block; width:19px; height:19px; border-radius:50%;
    border:3px solid rgba(255,255,255,.35); border-top-color:#fff;
    animation:spin .8s linear infinite; vertical-align:-4px; }
  button.b[disabled] { opacity:.6; }
</style>
</head>
<body>

<header>
  <img id="logo" src="logo.png" alt="go asia">
  <span class="sp"></span>
  <span id="cnt" class="tag"></span>
  <span id="who" class="tag"></span>
  <span id="net" class="tag"></span>
  <button id="lang">DE</button>
  <button id="gear">&#9881;</button>
</header>

<section id="setup" class="hide" style="padding:10px">
  <div id="pairBox">
    <div class="lbl" data-t="code">Code</div>
    <input id="cfgCode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6">
    <div style="height:10px"></div>
    <button id="cfgPair" class="b w" data-t="save">OK</button>
  </div>
  <div id="doneBox" class="hide">
    <div class="row"><span class="g" id="meName"></span><span class="s" id="meRole"></span></div>
    <button id="cfgUnpair" class="b g w" data-t="unpair">Abmelden</button>
  </div>
  <div id="cfgMsg" class="hint"></div>
  <label class="chk"><input id="cfgOneShot" type="checkbox"><span data-t="oneShot">Kamera nach Scan aus</span></label>
  <div class="lbl">URL</div>
  <input id="cfgApi" type="url" autocomplete="off">
</section>

<div id="app" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="flash"><div class="a"></div><div class="b"></div></div>

  <nav>
    <button data-mode="bind" class="sel" data-t="bind">Binden</button>
    <button data-mode="ship" data-t="ship">Ausgang</button>
    <button data-mode="info" data-t="info">Suchen</button>
  </nav>

  <main>
    <div class="cam hide" id="cam"><video id="video" playsinline muted autoplay></video><div class="fr"></div></div>
    <div class="two">
      <button id="btnCam" class="b" data-t="cam">Kamera</button>
      <button id="btnShot" class="b g" data-t="photo">Foto</button>
    </div>
    <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
    <form id="manForm" autocomplete="off"><input id="manual" type="text"></form>
    <div id="manHint" class="hint"></div>

    <section id="mBind">
      <div id="palletBox" class="hide">
        <div class="big" id="storeBig">&ndash;</div>
        <div class="sscc" id="ssccTxt"></div>
        <div id="lidList"></div>
        <div style="height:8px"></div>
        <div class="two">
          <button id="btnCommit" class="b" data-t="done">Fertig</button>
          <button id="btnDrop" class="b g" data-t="drop">Verwerfen</button>
        </div>
      </div>
    </section>

    <section id="mShip" class="hide"><div id="vList"></div></section>
    <section id="mInfo" class="hide"><div id="infoOut"></div></section>

    <div style="height:14px"></div>
    <button id="btnSync" class="b g w" data-t="reload">Laden</button>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js">
</script>
<script>(function () {
'use strict';

        check:'校验位错误', offline:'离线', noRead:'未识别',
        noCam:'无摄像头', reading:'…', dropped:'已取消', notFound:'未找到',
        askShip:'整次分货出货？', askOpen:'尚有未绑定贴纸，仍要出货？',
        needPair:'请先配对', codeBad:'配对码错误', locked:'已锁定', readonly:'只读',
        oneShot:'扫描后关闭摄像头', unbound:'已解绑',
        toomany:'该通道设备数已达上限' }
};
var lang = 'de';
function t(k) { return (TXT[lang] && TXT[lang][k]) || TXT.de[k] || k; }

var K = { cfg:'velten.cfg', cache:'velten.cache', queue:'velten.queue', lang:'velten.lang' };
function ls(k, v) {
  try {
    if (v === undefined) { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; }
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { return null; }
}
var cfg = ls(K.cfg) || { api:'', tok:'', who:'', rw:true };

var API_HASH = '3b607140cff05b4574266226409c1e92480be0e951cf060999b800d2a0b2c839';
var API_RE = /^https:\/\/script\.google\.com\/(?:a\/[A-Za-z0-9.-]+\/)?macros\/s\/([A-Za-z0-9_-]+)\/exec$/;

function sha256ascii(text) {
  var K = ('428a2f98 71374491 b5c0fbcf e9b5dba5 3956c25b 59f111f1 923f82a4 ab1c5ed5 ' +
           'd807aa98 12835b01 243185be 550c7dc3 72be5d74 80deb1fe 9bdc06a7 c19bf174 ' +
           'e49b69c1 efbe4786 0fc19dc6 240ca1cc 2de92c6f 4a7484aa 5cb0a9dc 76f988da ' +
           '983e5152 a831c66d b00327c8 bf597fc7 c6e00bf3 d5a79147 06ca6351 14292967 ' +
           '27b70a85 2e1b2138 4d2c6dfc 53380d13 650a7354 766a0abb 81c2c92e 92722c85 ' +
           'a2bfe8a1 a81a664b c24b8b70 c76c51a3 d192e819 d6990624 f40e3585 106aa070 ' +
           '19a4c116 1e376c08 2748774c 34b0bcb5 391c0cb3 4ed8aa4a 5b9cca4f 682e6ff3 ' +
           '748f82ee 78a5636f 84c87814 8cc70208 90befffa a4506ceb bef9a3f7 c67178f2')
          .split(' ').map(function (x) { return parseInt(x, 16) | 0; });
  var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
           0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  function rr(x, k) { return (x >>> k) | (x << (32 - k)); }

  var s = String(text), b = [], i, j;
  for (i = 0; i < s.length; i++) b.push(s.charCodeAt(i) & 255);
  var bits = b.length * 8;
  b.push(0x80);
  while (b.length % 64 !== 56) b.push(0);
  b.push(0, 0, 0, 0, (bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255);

  var w = new Array(64), a, bq, c, d, e, f, g, h, t1, t2, s0, s1;
  for (i = 0; i < b.length; i += 64) {
    for (j = 0; j < 16; j++) {
      w[j] = (b[i + j * 4] << 24) | (b[i + j * 4 + 1] << 16) |
             (b[i + j * 4 + 2] << 8) | b[i + j * 4 + 3];
    }
    for (j = 16; j < 64; j++) {
      s0 = rr(w[j - 15], 7) ^ rr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
      s1 = rr(w[j - 2], 17) ^ rr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
      w[j] = (((w[j - 16] + s0) | 0) + ((w[j - 7] + s1) | 0)) | 0;
    }
    a = H[0]; bq = H[1]; c = H[2]; d = H[3];
    e = H[4]; f = H[5]; g = H[6]; h = H[7];
    for (j = 0; j < 64; j++) {
      t1 = (((h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))) | 0) +
            ((((e & f) ^ (~e & g)) + ((K[j] + w[j]) | 0)) | 0)) | 0;
      t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) +
            ((a & bq) ^ (a & c) ^ (bq & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = bq; bq = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bq) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  var aus = '';
  for (i = 0; i < 8; i++) aus += ('0000000' + (H[i] >>> 0).toString(16)).slice(-8);
  return aus;
}

function apiOk(url) {
  var m = API_RE.exec(String(url === null || url === undefined ? '' : url));
  return !!m && sha256ascii(m[1]) === API_HASH;
}

(function fromLink() {
  var raw = (location.hash || '').replace(/^#/, '') || (location.search || '').replace(/^\?/, '');
  if (!raw) return;
  var api = new URLSearchParams(raw).get('api');
  history.replaceState(null, '', location.pathname);
  if (!api || !apiOk(api)) return;

  if (cfg.tok && cfg.api && cfg.api !== api) return;
  cfg.api = api; ls(K.cfg, cfg);
})();

function $(id) { return document.getElementById(id); }
function show(el, on) { el.classList.toggle('hide', !on); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); }

var actx = null;
function beep(kind) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value = kind === 'bad' ? 220 : kind === 'warn' ? 520 : 990;
    g.gain.setValueAtTime(0.001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.35, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (kind === 'bad' ? 0.45 : 0.14));
    o.start(); o.stop(actx.currentTime + (kind === 'bad' ? 0.46 : 0.15));
  } catch (e) {}
}

var meldung = { kind:'', key:'ready', a:'', b:'', bKey:'' };
function paint() {
  var el = $('flash');
  el.className = meldung.kind || '';
  var a = meldung.key ? t(meldung.key) : meldung.a;
  var b = meldung.bKey ? t(meldung.bKey) : meldung.b;
  el.innerHTML = '<div class="a">' + esc(a) + '</div><div class="b">' + esc(b || '') + '</div>';
}
function signal(kind) {
  beep(kind === 'bad' ? 'bad' : kind === 'warn' ? 'warn' : 'ok');
  try { if (navigator.vibrate) navigator.vibrate(kind === 'bad' ? [90,70,90] : 45); } catch (e) {}
}
function flash(kind, a, b, bKey) {
  meldung = { kind:kind, key:'', a:a, b:b, bKey:bKey || '' };
  paint(); signal(kind);
}
function flashT(kind, key, b, bKey) {
  meldung = { kind:kind, key:key, a:'', b:b, bKey:bKey || '' };
  paint(); signal(kind);
}

var SPINNER = '<span class="spin"></span>';
var pairBusy = false;

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'de';
  document.title = t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
    el.textContent = t(el.dataset.t);
  });
  $('lang').textContent = lang === 'zh' ? '中' : 'DE';
  $('btnCam').textContent = stream ? t('camOff') : t('cam');
  $('meRole').textContent = cfg.rw ? '' : t('readonly');

  if (pairBusy) $('cfgPair').innerHTML = SPINNER;
  paint();
  renderVerteilungen();
}

var LID_RE = /^T-\d{4}[A-Z]-\d{3}$/;

function ssccCore(raw) {
  var d = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
  return d.length >= 18 ? d.slice(-18) : '';
}
function ssccShow(core) { return core ? '00' + core : ''; }
function normSscc(raw) { return ssccShow(ssccCore(raw)); }
function ssccEq(a, b) { var x = ssccCore(a); return x !== '' && x === ssccCore(b); }

function splitMulti(s) {
  return String(s == null ? '' : s).split('|').filter(function (x) { return x !== ''; });
}
function ssccOhne(feld, sscc) {
  return splitMulti(feld).filter(function (x) { return !ssccEq(x, sscc); });
}
function gs1Ok(raw) {
  var s = ssccCore(raw);
  if (!s) return false;
  var sum = 0;
  for (var i = 0; i < 17; i++) sum += Number(s.charAt(16 - i)) * (i % 2 === 0 ? 3 : 1);
  return ((10 - sum % 10) % 10) === Number(s.charAt(17));
}
function classify(x) {
  var s = String(x || '').trim().toUpperCase();
  if (LID_RE.test(s)) return { kind:'lid', value:s };
  var c = ssccCore(s);
  if (c) return { kind:'sscc', value:ssccShow(c), checkOk:gs1Ok(c) };
  return { kind:null, value:s };
}

function apiGet(action, params) {
  var p = new URLSearchParams(Object.assign({ action:action, tok:cfg.tok }, params || {}));
  return fetch(cfg.api + (cfg.api.indexOf('?') < 0 ? '?' : '&') + p.toString())
    .then(function (r) { return r.json(); }).then(guard);
}
function apiPost(action, body) {

  return fetch(cfg.api, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=UTF-8' },
    body:JSON.stringify(Object.assign({ action:action, tok:cfg.tok }, body || {})) })
    .then(function (r) { return r.json(); }).then(guard);
}

function guard(d) {
  if (d && d.ok === false && d.code === 'auth') {
    cfg.tok = ''; cfg.who = ''; ls(K.cfg, cfg);
    openSetup(true);
    flashT('bad', 'needPair');
  }
  return d;
}

var queue = ls(K.queue) || [], flushing = false, abgelehnt = false;
var FLUSH_VERSUCHE = 3, versuche = 0;
function warte(ms) { return new Promise(function (fertig) { setTimeout(fertig, ms); }); }
var cache = ls(K.cache) || { at:0, verteilungen:[], labels:[] };
var byLid = {};
function reindex() {
  byLid = {};
  (cache.labels || []).forEach(function (l) { byLid[l.lid] = l; });
  var n = (cache.labels || []).length;
  var offen = (cache.labels || []).filter(function (l) { return l.status === '待绑定'; }).length;
  $('cnt').textContent = n ? (n - offen) + '/' + n : '';
  renderVerteilungen();
}

function setNet(on) {
  var el = $('net');
  if (queue.length) { el.textContent = '⇧' + queue.length; el.className = 'tag off'; return; }
  el.textContent = on ? '●' : '○';
  el.className = 'tag ' + (on ? 'on' : 'off');
}
function queueShow() { setNet(navigator.onLine !== false); }
function sync() {
  return apiGet('sync').then(function (d) {
    if (!d.ok) throw new Error(d.error);
    cache = { at:Date.now(), verteilungen:d.verteilungen || [], labels:d.labels || [] };
    ls(K.cache, cache); reindex(); setNet(true);
  }).catch(function () { setNet(false); });
}

function enqueue(job) { queue.push(job); ls(K.queue, queue); queueShow(); flush(); }
function flush() {
  if (flushing || !queue.length) return Promise.resolve();
  flushing = true;
  var job = queue[0];
  return apiPost(job.action, job.body).then(function (d) {
    flushing = false;
    if (!d) { setNet(false); return; }

    if (!d.ok && !d.code && versuche < FLUSH_VERSUCHE) {
      versuche++;
      return warte(versuche * 2000).then(flush);
    }
    versuche = 0;

    queue.shift(); ls(K.queue, queue); setNet(true); queueShow();

    if (!d.ok && d.code !== 'auth') {
      abgelehnt = true;
      if (d.code === 'readonly') flashT('bad', 'readonly');
      else flash('bad', d.error || d.code || '');
    }

    if (d.ok && d.results && d.results.some(function (r) { return !r.ok; })) abgelehnt = true;

    if (queue.length) return flush();
    if (abgelehnt) { abgelehnt = false; return sync(); }
  }).catch(function () { flushing = false; setNet(false); });
}
window.addEventListener('online', function () { setNet(true); flush(); });
window.addEventListener('offline', function () { setNet(false); });

var mode = 'bind';
Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
  b.onclick = function () {
    Array.prototype.forEach.call(document.querySelectorAll('nav button'),
      function (x) { x.classList.remove('sel'); });
    b.classList.add('sel');
    mode = b.dataset.mode;
    show($('mBind'), mode === 'bind');
    show($('mShip'), mode === 'ship');
    show($('mInfo'), mode === 'info');
    flashT('', mode);
  };
});

var pal = null;

function palVorhanden(sscc) {
  return (cache.labels || []).filter(function (l) {
    return splitMulti(l.sscc).some(function (x) { return ssccEq(x, sscc); });
  }).map(function (l) {
    return { lid:l.lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid,
             alt:true, shipped:String(l.status) === '已出货' };
  });
}

function palRender() {
  show($('palletBox'), !!pal);
  if (!pal) return;
  var st = {};
  pal.lids.forEach(function (l) { st[l.store] = 1; });
  var names = Object.keys(st);
  $('storeBig').textContent = names.length ? names.join(' / ') : '–';
  $('ssccTxt').textContent = pal.sscc.replace(/(\d{4})(?=\d)/g, '$1 ');
  $('lidList').innerHTML = pal.lids.map(function (l, i) {
    return '<div class="row' + (l.alt ? ' alt' : '') + '"><span class="g"><span class="m">' +
      esc(l.lid) + '</span>' +
      '<div class="s">' + esc(l.store) + ' ' + esc(l.seq) + '/' + esc(l.total) + '</div></span>' +
      '<span class="x" data-rm="' + i + '">&times;</span></div>';
  }).join('');
  Array.prototype.forEach.call($('lidList').querySelectorAll('[data-rm]'), function (x) {
    x.onclick = function () {
      var i = Number(x.dataset.rm), l = pal.lids[i];
      if (!l) return;

      if (l.alt && l.shipped) { flashT('bad', 'shipped', l.lid); return; }
      pal.lids.splice(i, 1);

      if (l.alt) pal.weg.push(l.lid);
      palRender();
    };
  });
}
function palCommit(silent) {
  if (!pal) return;
  var weg = pal.weg || [];
  var neu = pal.lids.filter(function (l) { return !l.alt; })
                    .map(function (l) { return l.lid; });

  if (!neu.length && !weg.length) { pal = null; palRender(); return; }

  if (weg.length) {
    enqueue({ action:'unbind', body:{ sscc:pal.sscc, lids:weg } });
    weg.forEach(function (lid) {
      var c = byLid[lid];
      if (!c) return;
      var rest = ssccOhne(c.sscc, pal.sscc);
      c.sscc = rest.join('|');
      if (String(c.status) !== '已出货') c.status = rest.length ? '已绑定' : '待绑定';
    });
  }
  if (neu.length) {
    enqueue({ action:'bindPallet', body:{ sscc:pal.sscc, lids:neu } });
    neu.forEach(function (lid) {
      var c = byLid[lid];
      if (!c) return;
      var rest = ssccOhne(c.sscc, pal.sscc);
      rest.push(pal.sscc);
      c.sscc = rest.join('|');
      if (String(c.status) !== '已出货') c.status = '已绑定';
    });
  }
  ls(K.cache, cache); reindex();
  if (!silent) {
    if (neu.length) flashT('ok', 'saved', neu.length + (weg.length ? ' −' + weg.length : ''));
    else flashT('ok', 'unbound', weg.length + '');
  }
  pal = null; palRender();
}

var lastText = '', lastAt = 0;
function onScan(text) {
  var now = Date.now();
  if (text === lastText && now - lastAt < 2500) return;
  lastText = text; lastAt = now;
  var c = classify(text);
  if (!c.kind) { flashT('bad', 'noRead'); return; }

  if (cfg.oneShot && stream) stopCam();
  if (mode === 'info') return doInfo(c);
  if (mode === 'ship') return doShip(c);
  return doBind(c);
}

function doBind(c) {
  if (c.kind === 'sscc') {
    if (pal && ssccEq(pal.sscc, c.value)) { flashT('warn', 'already'); return; }
    if (pal) palCommit(true);
    pal = { sscc:c.value, checkOk:c.checkOk, lids:palVorhanden(c.value), weg:[] };
    palRender();
    if (c.checkOk) flashT('ok', 'newPal', c.value.slice(-6));
    else flashT('warn', 'newPal', '', 'check');
    return;
  }
  if (!pal) { flashT('bad', 'needCode'); return; }
  var l = byLid[c.value];
  if (!l) { flashT('bad', 'unknown', c.value); return; }

  var wi = pal.weg.indexOf(c.value);
  if (wi >= 0) {
    pal.weg.splice(wi, 1);
    pal.lids.push({ lid:l.lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid,
                    alt:true, shipped:String(l.status) === '已出货' });
    palRender();
    flash('ok', l.store, l.seq + '/' + l.total);
    return;
  }
  if (pal.lids.some(function (x) { return x.lid === c.value; })) { flashT('warn', 'already'); return; }

  var andere = ssccOhne(l.sscc, pal.sscc);
  if (andere.length) { flashT('bad', 'boundElse', String(andere[0]).slice(-6)); return; }
  var fremd = pal.lids.filter(function (x) { return x.store !== l.store; });
  pal.lids.push({ lid:l.lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid });
  palRender();
  if (fremd.length) flashT('warn', 'otherStore', fremd[0].store + ' / ' + l.store);
  else flash('ok', l.store, l.seq + '/' + l.total);
}

function doShip(c) {
  if (c.kind !== 'sscc') { flashT('bad', 'needCode'); return; }
  enqueue({ action:'shipPallet', body:{ sscc:c.value } });
  flashT('ok', 'shipped', c.value.slice(-6));
}

function doInfo(c) {
  var out = $('infoOut');
  var l = c.kind === 'lid' ? byLid[c.value] : null;
  if (l) {
    out.innerHTML = '<div class="row"><span class="g"><span class="m">' + esc(l.lid) + '</span>' +
      '<div class="s">' + esc(l.store) + ' ' + esc(l.seq) + '/' + esc(l.total) + ' · ' +
      esc(l.vid) + ' · ' + esc(l.status) + '</div></span></div>';
    flash('ok', l.store, l.seq + '/' + l.total);
    return;
  }
  flashT('', 'reading');
  apiGet('lookup', { q:c.value }).then(function (d) {
    if (!d.ok || !d.found) { out.innerHTML = ''; flashT('warn', 'notFound'); return; }
    var p = d.pallet || d.label;
    out.innerHTML = '<div class="row"><span class="g">' + esc(p.store || '') +
      '<div class="s">' + esc(p.status || '') + '</div></span></div>';
    flash('ok', p.store || '', p.status || '');
  }).catch(function () { flashT('bad', 'offline'); });
}

function renderVerteilungen() {
  var el = $('vList');
  if (!el) return;
  el.innerHTML = (cache.verteilungen || []).map(function (v) {
    return '<div class="row"><span class="g"><span class="m">' + esc(v.vid) + '</span>' +
      '<div class="s">' + esc(v.name) + '</div></span>' +
      '<button class="b" style="flex:0 0 auto;padding:9px 14px" data-ship="' + esc(v.vid) + '">&#9654;</button></div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('[data-ship]'), function (b) {
    b.onclick = function () {
      var vid = b.dataset.ship;
      if (!confirm(vid + '\n' + t('askShip'))) return;
      apiPost('shipVerteilung', { vid:vid }).then(function (d) {
        if (d.ok) { flashT('ok', 'shipped', vid); sync(); }
        else if (d.code === 'unbound_labels') {
          if (confirm(d.unbound.length + '\n' + t('askOpen'))) {
            apiPost('shipVerteilung', { vid:vid, force:true }).then(function () { sync(); });
          }
        } else if (d.code === 'readonly') flashT('bad', 'readonly');
        else flash('bad', d.error || d.code || '');
      }).catch(function () { flashT('bad', 'offline'); });
    };
  });
}

var stream = null, detector = null, timer = 0, zx = null, zxCanvas = null;
function hints() {
  var h = new Map();
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128]);
  h.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return h;
}
function nativeDetector() {
  if (!('BarcodeDetector' in window) || typeof window.BarcodeDetector.getSupportedFormats !== 'function') {
    return Promise.resolve(null);
  }
  return window.BarcodeDetector.getSupportedFormats().then(function (f) {
    if (!f || f.indexOf('qr_code') < 0 || f.indexOf('code_128') < 0) return null;
    return new window.BarcodeDetector({ formats:['qr_code','code_128'] });
  }).catch(function () { return null; });
}
function zxDecodeFrame(v) {
  var w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return null;
  var scale = w > 1280 ? 1280 / w : 1;
  var cw = Math.round(w * scale), ch = Math.round(h * scale);
  if (!zxCanvas) zxCanvas = document.createElement('canvas');
  if (zxCanvas.width !== cw || zxCanvas.height !== ch) { zxCanvas.width = cw; zxCanvas.height = ch; }
  zxCanvas.getContext('2d', { willReadFrequently:true }).drawImage(v, 0, 0, cw, ch);
  var src = new ZXing.HTMLCanvasElementLuminanceSource(zxCanvas);
  var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
  try { return zx.decodeWithState(bmp); } catch (e) { return null; }
}
function scanLoop(v) {
  var useNative = !!detector, nativeMiss = 0;
  (function tick() {
    if (!stream) return;
    if (v.readyState < 2 || !v.videoWidth) { timer = setTimeout(tick, 120); return; }
    if (useNative) {
      detector.detect(v).then(function (c) {
        if (c && c.length) { nativeMiss = 0; onScan(c[0].rawValue); }
        else if (++nativeMiss > 60) useNative = false;
      }).catch(function () { useNative = false; }).then(function () {
        if (stream) timer = setTimeout(tick, 180);
      });
      return;
    }
    if (!zx) { zx = new ZXing.MultiFormatReader(); zx.setHints(hints()); }
    var r = zxDecodeFrame(v);
    if (r) onScan(r.getText());
    timer = setTimeout(tick, r ? 400 : 120);
  })();
}
function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { flashT('bad', 'noCam'); return; }
  beep('ok');
  var v = $('video');
  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false
  }).then(function (s) {
    stream = s; v.srcObject = s;
    show($('cam'), true); $('btnCam').textContent = t('camOff');
    return v.play().catch(function () {});
  }).then(nativeDetector).then(function (d) {
    detector = d;
    scanLoop(v);
  }).catch(function (e) { stopCam(); flashT('bad', 'noCam', (e && e.name) || ''); });
}
function stopCam() {
  if (timer) { clearTimeout(timer); timer = 0; }
  detector = null;
  if (stream) { stream.getTracks().forEach(function (x) { x.stop(); }); stream = null; }
  $('video').srcObject = null;
  show($('cam'), false); $('btnCam').textContent = t('cam');
}
$('btnCam').onclick = function () { stream ? stopCam() : startCam(); };

$('btnShot').onclick = function () { $('photo').click(); };
$('photo').onchange = function (ev) {
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  flashT('', 'reading');
  var img = new Image();
  img.onload = function () {
    new ZXing.BrowserMultiFormatReader(hints()).decodeFromImageElement(img)
      .then(function (r) { URL.revokeObjectURL(img.src); onScan(r.getText()); })
      .catch(function () { URL.revokeObjectURL(img.src); flashT('bad', 'noRead'); });
  };
  img.src = URL.createObjectURL(f);
};

$('manForm').onsubmit = function (e) {
  e.preventDefault();
  var v = $('manual').value.trim();
  if (!v) return;
  onScan(v); $('manual').value = ''; $('manHint').textContent = '';
};
$('manual').oninput = function () {
  var d = $('manual').value.replace(/[^0-9]/g, '');
  if (d.length >= 18) {
    $('manHint').innerHTML = gs1Ok(d)
      ? '<span style="color:var(--ok)">&#10003;</span>'
      : '<span style="color:var(--bad)">&#10007; ' + esc(t('check')) + '</span>';
  } else {
    $('manHint').textContent = d.length ? d.length + '/18' : '';
  }
};

$('btnCommit').onclick = function () { palCommit(); };
$('btnDrop').onclick = function () { pal = null; palRender(); flashT('', 'dropped'); };
$('btnSync').onclick = function () { sync().then(function () { flashT('ok', 'reload'); }); };
$('lang').onclick = function () { lang = lang === 'zh' ? 'de' : 'zh'; ls(K.lang, lang); applyLang(); };

function openSetup(on) {
  show($('setup'), on); show($('app'), !on);
  if (!on) return;
  $('cfgApi').value = cfg.api;
  $('cfgCode').value = '';
  $('cfgOneShot').checked = !!cfg.oneShot;
  show($('pairBox'), !cfg.tok);
  show($('doneBox'), !!cfg.tok);
  $('meName').textContent = cfg.who || '';
  $('meRole').textContent = cfg.rw ? '' : t('readonly');
}
$('gear').onclick = function () { openSetup($('setup').classList.contains('hide')); };

function setPairBusy(on) {
  pairBusy = on;
  var b = $('cfgPair');
  b.disabled = on;
  b.innerHTML = on ? SPINNER : esc(t('save'));
  $('cfgCode').disabled = on;
  $('cfgApi').disabled = on;
}

$('cfgPair').onclick = function () {
  if (pairBusy) return;
  var api = $('cfgApi').value.trim();
  var code = $('cfgCode').value.trim().toUpperCase();
  if (!apiOk(api) || !code) { $('cfgMsg').textContent = '!'; return; }
  cfg.api = api; ls(K.cfg, cfg);
  $('cfgMsg').textContent = '';
  setPairBusy(true);

  var frist = setTimeout(function () {
    if (!pairBusy) return;
    setPairBusy(false);
    $('cfgMsg').textContent = t('offline');
  }, 30000);
  apiPost('pair', { code:code }).then(function (d) {
    clearTimeout(frist);
    setPairBusy(false);
    if (!d.ok) {
      $('cfgMsg').textContent =
        d.code === 'locked' ? t('locked') :
        d.code === 'toomany' ? t('toomany') : t('codeBad');
      return;
    }
    cfg.tok = d.token; cfg.who = d.who; cfg.rw = !!d.rw;
    ls(K.cfg, cfg);
    boot();
  }).catch(function () {
    clearTimeout(frist);
    setPairBusy(false);
    $('cfgMsg').textContent = t('offline');
  });
};

$('cfgUnpair').onclick = function () {
  cfg.tok = ''; cfg.who = ''; ls(K.cfg, cfg);
  openSetup(true);
};

$('cfgOneShot').onchange = function () { cfg.oneShot = this.checked; ls(K.cfg, cfg); };

$('cfgCode').oninput = function () {
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
};

lang = ls(K.lang) || ((navigator.language || '').slice(0, 2) === 'zh' ? 'zh' : 'de');
function boot() {
  $('who').textContent = cfg.who || '';
  openSetup(false);
  meldung = { kind:'', key:'ready', a:'', b:'', bKey:'' };
  applyLang(); reindex(); queueShow(); sync().then(flush);
}
if (cfg.api && cfg.tok) {
  boot();
} else {
  openSetup(true);
  applyLang();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
