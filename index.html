<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#006935">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>Velten Scan</title>
<style>  :root {

    --gruen:#006935; --hell:#8EC31F; --rot:#E60013;
    --bg:#ffffff; --panel:#f4f6f4; --line:#dfe4e0; --text:#14211b; --dim:#6b7a72;
    --ok:#006935; --warn:#8f5700; --bad:#E60013; --accent:#006935;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none; }
  body { display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0); }

  header { display:flex; align-items:center; gap:8px; padding:7px 10px;
    background:var(--gruen); flex:0 0 auto; }
  #logo { height:30px; width:auto; flex:0 0 auto; display:block; }
  header .sp { flex:1; }
  .tag { font-size:12px; padding:3px 8px; border-radius:99px;
    background:rgba(255,255,255,.18); color:#fff; }
  .tag:empty { display:none; }
  .tag.on { background:var(--hell); color:var(--gruen); font-weight:700; }
  .tag.off { background:var(--rot); color:#fff; font-weight:700; }
  #lang { font-size:12px; font-weight:700; color:#fff; background:rgba(255,255,255,.18);
    border:0; border-radius:99px; padding:5px 10px; }
  #gear { border:0; background:transparent; color:#fff; font-size:18px; padding:2px 4px; }

  #flash { flex:0 0 auto; padding:14px 10px; text-align:center; background:var(--panel);
    border-bottom:1px solid var(--line); color:var(--text); }
  #flash .a { font-size:26px; font-weight:800; line-height:1.15; word-break:break-word; }
  #flash .b { font-size:14px; opacity:.9; margin-top:2px; }
  #flash .b:empty { display:none; }
  #flash.ok { background:var(--ok); color:#fff; }
  #flash.warn { background:var(--warn); color:#fff; }
  #flash.bad { background:var(--bad); color:#fff; }

  nav { display:flex; flex:0 0 auto; background:var(--bg); border-bottom:1px solid var(--line); }
  nav button { flex:1; padding:11px 2px; border:0; background:transparent; color:var(--dim);
    font-size:15px; font-weight:600; border-bottom:3px solid transparent; }
  nav button.sel { color:var(--text); border-bottom-color:var(--accent); }

  main { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; }
  .hide { display:none !important; }

  .cam { position:relative; background:#000; border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .cam video { width:100%; max-height:34vh; display:block; object-fit:cover; }
  .cam .fr { position:absolute; inset:20% 6%; border:2px solid rgba(255,255,255,.9); border-radius:6px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.3); pointer-events:none; }
  .cam .fr::after { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#e53e3e; }

  .two { display:flex; gap:8px; }
  button.b { flex:1; padding:14px 8px; font-size:16px; font-weight:700; border:0; border-radius:10px;
    background:var(--accent); color:#fff; }
  button.b.g { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  button.b.w { width:100%; }
  input { width:100%; padding:13px; font-size:17px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); margin-top:8px; }
  #cfgCode { font-size:30px; text-align:center; letter-spacing:8px; font-weight:800;
    text-transform:uppercase; font-family:ui-monospace,Menlo,monospace; }

  .big { font-size:32px; font-weight:800; text-align:center; padding:16px 8px;
    background:var(--panel); border:2px solid var(--gruen); border-radius:10px;
    margin:10px 0 8px; word-break:break-word; color:var(--gruen); }
  .sscc { font-family:ui-monospace,Menlo,monospace; font-size:15px; text-align:center;
    color:var(--dim); letter-spacing:1px; }
  .row { display:flex; align-items:center; gap:8px; padding:10px; background:var(--panel);
    border:1px solid var(--line); border-radius:9px; margin-top:6px; font-size:15px; }
  .row .g { flex:1; min-width:0; }
  .row .m { font-family:ui-monospace,Menlo,monospace; }
  .row .s { color:var(--dim); font-size:13px; }
  .row .x { color:var(--dim); font-size:22px; padding:0 6px; }
  .hint { font-size:12px; color:var(--dim); margin-top:4px; min-height:16px; }
  .lbl { font-size:12px; color:var(--dim); margin-top:10px; }

  .chk { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:15px; }
  .chk input { width:22px; height:22px; margin:0; flex:0 0 auto; accent-color:var(--gruen); }

  .row.alt { border-left:4px solid var(--gruen); }

  @keyframes spin { to { transform:rotate(360deg); } }
  .spin { display:inline-block; width:19px; height:19px; border-radius:50%;
    border:3px solid rgba(255,255,255,.35); border-top-color:#fff;
    animation:spin .8s linear infinite; vertical-align:-4px; }
  button.b[disabled] { opacity:.6; }

  .big.versendet { border-color:var(--rot); color:var(--rot); background:#fdecee; }
  .banner { margin-top:8px; padding:11px 10px; border-radius:9px; text-align:center;
    font-size:17px; font-weight:800; background:var(--rot); color:#fff; word-break:break-word; }
  .banner.teil { background:var(--warn); }
  .banner:empty { display:none; }
  .row.raus { opacity:.55; }

  .vk { padding:11px 10px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; margin-top:8px; }
  .vk-kopf { display:flex; align-items:baseline; gap:7px; }
  .vk-kopf .pf { color:var(--dim); font-size:13px; width:12px; }
  .vk-kopf .m { font-family:ui-monospace,Menlo,monospace; font-weight:700; }
  .vk-kopf .zahl { margin-left:auto; font-weight:800; font-size:17px; }
  .vk.fertig .vk-kopf .zahl { color:var(--gruen); }
  .vk .s { color:var(--dim); font-size:13px; margin:1px 0 0 19px; word-break:break-word; }
  .balken { display:flex; height:8px; border-radius:99px; background:var(--line);
    overflow:hidden; margin-top:8px; }
  .balken i { display:block; height:100%; }
  .balken .raus { background:var(--gruen); }
  .balken .geb { background:var(--hell); }
  .fil { margin-top:10px; border-top:1px solid var(--line); padding-top:2px; }
  .fz { display:flex; align-items:center; flex-wrap:wrap; gap:5px; padding:7px 0;
    font-size:15px; border-bottom:1px solid var(--line); }
  .fz:last-child { border-bottom:0; }
  .fz .g { flex:1; min-width:40%; word-break:break-word; }
  .fz .zahl { font-weight:700; color:var(--dim); }
  .fz.offen .zahl { color:var(--warn); }
  .chip { font-size:12px; font-weight:700; padding:2px 7px; border-radius:99px;
    background:#fff2dc; color:var(--warn); border:1px solid #f0d7a8; }
</style>
</head>
<body>

<header>
  <img id="logo" src="logo.png" alt="go asia">
  <span class="sp"></span>
  <span id="cnt" class="tag"></span>
  <span id="who" class="tag"></span>
  <span id="net" class="tag"></span>
  <button id="lang">DE</button>
  <button id="gear">&#9881;</button>
</header>

<section id="setup" class="hide" style="padding:10px">
  <div id="pairBox">
    <div class="lbl" data-t="code">Code</div>
    <input id="cfgCode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6">
    <div style="height:10px"></div>
    <button id="cfgPair" class="b w" data-t="save">OK</button>
  </div>
  <div id="doneBox" class="hide">
    <div class="row"><span class="g" id="meName"></span><span class="s" id="meRole"></span></div>
    <button id="cfgUnpair" class="b g w" data-t="unpair">Abmelden</button>
  </div>
  <div id="cfgMsg" class="hint"></div>
  <label class="chk"><input id="cfgOneShot" type="checkbox"><span data-t="oneShot">Kamera nach Scan aus</span></label>
  <div class="lbl">URL</div>
  <input id="cfgApi" type="url" autocomplete="off">
</section>

<div id="app" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="flash"><div class="a"></div><div class="b"></div></div>

  <nav>
    <button data-mode="bind" class="sel" data-t="bind">Binden</button>
    <button data-mode="ship" data-t="ship">Ausgang</button>
    <button data-mode="stand" data-t="stand">Stand</button>
  </nav>

  <main>
    <div id="scanBox">
      <div class="cam hide" id="cam"><video id="video" playsinline muted autoplay></video><div class="fr"></div></div>
      <div class="two">
        <button id="btnCam" class="b" data-t="cam">Kamera</button>
        <button id="btnShot" class="b g" data-t="photo">Foto</button>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
      <form id="manForm" autocomplete="off"><input id="manual" type="text"></form>
      <div id="manHint" class="hint"></div>
    </div>

    <section id="mBind">
      <div id="palletBox" class="hide">
        <div class="big" id="storeBig">&ndash;</div>
        <div class="sscc" id="ssccTxt"></div>
        <div id="palBanner" class="banner"></div>
        <div id="lidList"></div>
        <div style="height:8px"></div>
        <div class="two">
          <button id="btnCommit" class="b" data-t="done">Fertig</button>
          <button id="btnDrop" class="b g" data-t="drop">Verwerfen</button>
        </div>
      </div>
    </section>

    <section id="mShip" class="hide">
      <div id="shipBox" class="hide">
        <div class="big" id="shipStore">&ndash;</div>
        <div class="sscc" id="shipSscc"></div>
        <div id="shipBanner" class="banner"></div>
        <div id="shipList"></div>
        <div style="height:10px"></div>
        <div class="two">
          <button id="btnShipNo" class="b g" data-t="cancel">Abbrechen</button>
          <button id="btnShipOk" class="b" data-t="confirmShip">Ausgang buchen</button>
        </div>
      </div>
    </section>
    <section id="mStand" class="hide"><div id="vList"></div></section>

    <div style="height:14px"></div>
    <button id="btnSync" class="b g w" data-t="reload">Laden</button>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js">
</script>

  for (var i = 0; i < 17; i++) sum += Number(s.charAt(16 - i)) * (i % 2 === 0 ? 3 : 1);
  return ((10 - sum % 10) % 10) === Number(s.charAt(17));
}
function classify(x) {
  var s = String(x || '').trim().toUpperCase();
  if (LID_RE.test(s)) return { kind:'lid', value:s };
  var c = ssccCore(s);
  if (c) return { kind:'sscc', value:ssccShow(c), checkOk:gs1Ok(c) };
  return { kind:null, value:s };
}

function mitFrist(p, ms) {
  return new Promise(function (ok, fail) {
    var uhr = setTimeout(function () { fail(new Error('frist')); }, ms);
    p.then(function (v) { clearTimeout(uhr); ok(v); },
           function (e) { clearTimeout(uhr); fail(e); });
  });
}

var MELDUNG_FUER = { already_shipped:'palShipped', empty:'emptyPal', readonly:'readonly' };

function apiGet(action, params) {
  var p = new URLSearchParams(Object.assign({ action:action, tok:cfg.tok }, params || {}));
  return fetch(cfg.api + (cfg.api.indexOf('?') < 0 ? '?' : '&') + p.toString())
    .then(function (r) { return r.json(); }).then(guard);
}
function apiPost(action, body) {

  return fetch(cfg.api, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=UTF-8' },
    body:JSON.stringify(Object.assign({ action:action, tok:cfg.tok }, body || {})) })
    .then(function (r) { return r.json(); }).then(guard);
}

function guard(d) {
  if (d && d.ok === false && d.code === 'auth') {
    cfg.tok = ''; cfg.who = ''; ls(K.cfg, cfg);
    openSetup(true);
    flashT('bad', 'needPair');
  }
  return d;
}

var queue = ls(K.queue) || [], flushing = false, flushLauf = null, abgelehnt = false;

var fertigeAuftraege = [], fertigNr = 0;
function merkeFertig(job) {
  fertigeAuftraege.push({ nr:++fertigNr, job:job });
  if (fertigeAuftraege.length > 50) fertigeAuftraege.shift();
}
var FLUSH_VERSUCHE = 3, FLUSH_FRIST = 30000, versuche = 0;
function warte(ms) { return new Promise(function (fertig) { setTimeout(fertig, ms); }); }
var cache = ls(K.cache) || { at:0, verteilungen:[], labels:[] };
var byLid = {};

function aufPalette(sscc) {
  return (cache.labels || []).filter(function (l) {
    return splitMulti(l.sscc).some(function (x) { return ssccEq(x, sscc); });
  }).map(function (l) { return l.lid; });
}
function cacheBinden(sscc, lids) {
  lids.forEach(function (lid) {
    var c = byLid[lid];
    if (!c) return;
    var rest = ssccOhne(c.sscc, sscc);
    rest.push(sscc);
    c.sscc = rest.join('|');
    if (String(c.status) !== '已出货') c.status = '已绑定';
  });
}
function cacheLoesen(sscc, lids) {
  lids.forEach(function (lid) {
    var c = byLid[lid];

    if (!c || String(c.status) === '已出货') return;
    var rest = ssccOhne(c.sscc, sscc);
    c.sscc = rest.join('|');
    c.status = rest.length ? '已绑定' : '待绑定';
  });
}
function cacheVersendet(sscc) {
  (cache.labels || []).forEach(function (l) {
    if (splitMulti(l.sscc).some(function (x) { return ssccEq(x, sscc); })) l.status = '已出货';
  });
}
function cacheAnwenden(job) {
  var b = job.body || {};
  if (!b.sscc) return;
  if (job.action === 'bindPallet') cacheBinden(b.sscc, b.lids || []);
  else if (job.action === 'unbind') cacheLoesen(b.sscc, b.lids && b.lids.length ? b.lids : aufPalette(b.sscc));
  else if (job.action === 'shipPallet') cacheVersendet(b.sscc);
}

function ausstehend(sscc) {
  return queue.filter(function (j) { return j.body && j.body.sscc && ssccEq(j.body.sscc, sscc); });
}
function ausstehendRaus(sscc) {
  return ausstehend(sscc).some(function (j) { return j.action === 'shipPallet'; });
}

function mitAusstehenden(lids, sscc) {
  var ergebnis = lids.slice();
  ausstehend(sscc).forEach(function (j) {
    var liste = j.body.lids || [];
    if (j.action === 'bindPallet') {
      liste.forEach(function (l) { if (ergebnis.indexOf(l) < 0) ergebnis.push(l); });
    } else if (j.action === 'unbind') {
      var weg = liste.length ? liste : ergebnis.slice();
      ergebnis = ergebnis.filter(function (l) {
        return weg.indexOf(l) < 0 || (byLid[l] && String(byLid[l].status) === '已出货');
      });
    }
  });
  return ergebnis;
}

function reindex() {
  byLid = {};
  (cache.labels || []).forEach(function (l) { byLid[l.lid] = l; });
  var n = (cache.labels || []).length;
  var offen = (cache.labels || []).filter(function (l) { return l.status === '待绑定'; }).length;
  $('cnt').textContent = n ? (n - offen) + '/' + n : '';
  renderVerteilungen();
}

function setNet(on) {
  var el = $('net');
  if (queue.length) { el.textContent = '⇧' + queue.length; el.className = 'tag off'; return; }
  el.textContent = on ? '●' : '○';
  el.className = 'tag ' + (on ? 'on' : 'off');
}
function queueShow() {
  setNet(navigator.onLine !== false);

  if (aus && aus.mitOffen && !aus.pruefen && !aus.sende && !ausstehend(aus.sscc).length) {
    ausPruefen(aus, true);
  }
  ausRender();
}

function sync() {
  var ab = fertigNr;
  return apiGet('sync').then(function (d) {
    if (!d.ok) throw new Error(d.error);
    cache = { at:Date.now(), verteilungen:d.verteilungen || [], labels:d.labels || [] };
    byLid = {};
    cache.labels.forEach(function (l) { byLid[l.lid] = l; });

    fertigeAuftraege.forEach(function (e) { if (e.nr > ab) cacheAnwenden(e.job); });
    queue.forEach(cacheAnwenden);
    ls(K.cache, cache); reindex(); setNet(true);
    return true;
  }).catch(function () { setNet(false); return false; });
}

function enqueue(job) { queue.push(job); ls(K.queue, queue); queueShow(); flush(); }

function flush() {
  if (flushing) return flushLauf;

  if (!queue.length || !cfg.tok) return Promise.resolve();
  flushing = true;
  flushLauf = flushSchritt().then(function (grund) {
    flushing = false;

    if (grund === 'leer' && queue.length) return flush();
  }, function () { flushing = false; });
  return flushLauf;
}

function flushSchritt() {
  if (!queue.length) {
    if (!abgelehnt) return Promise.resolve('leer');
    abgelehnt = false;
    return sync().then(function () { return 'leer'; });
  }
  var job = queue[0];
  return mitFrist(apiPost(job.action, job.body), FLUSH_FRIST).then(function (d) {
    if (!d) { setNet(false); return 'netz'; }

    if (!d.ok && d.code === 'auth') return 'auth';

    if (!d.ok && !d.code && versuche < FLUSH_VERSUCHE) {
      versuche++;
      return warte(versuche * 2000).then(flushSchritt);
    }
    versuche = 0;

    queue.shift(); ls(K.queue, queue); setNet(true);
    var wo = job.body && job.body.sscc ? String(job.body.sscc).slice(-6) : '';

    if (!d.ok) {
      abgelehnt = true;
      if (MELDUNG_FUER[d.code]) flashT('bad', MELDUNG_FUER[d.code], wo);
      else flash('bad', d.error || d.code || '', wo);
    }

    var nein = d.ok && d.results ? d.results.filter(function (r) { return !r.ok; }) : [];
    if (nein.length) {
      abgelehnt = true;
      flashT('bad', nein[0].code === 'bound_elsewhere' ? 'boundElse' :
                    nein[0].code === 'void' ? 'voided' : 'unknown',
             nein.map(function (r) { return r.lid; }).join(' '));
      var vorher = queue.length;
      queue = queue.filter(function (j) {
        return !(j.action === 'shipPallet' && j.body && ssccEq(j.body.sscc, job.body.sscc));
      });
      if (queue.length !== vorher) { ls(K.queue, queue); flashT('bad', 'shipHeld', wo); }
    }

    if (d.ok && d.skipped && d.skipped.length) {
      abgelehnt = true;
      flashT('bad', 'palShipped', d.skipped.length + '');
    }
    if (d.ok) {

      merkeFertig(nein.length ? { action:job.action, body:{ sscc:job.body.sscc,
        lids:d.results.filter(function (r) { return r.ok; }).map(function (r) { return r.lid; }) } } : job);

      if (job.action === 'shipPallet') flashT('ok', 'shipDone', wo);
    }
    queueShow();
    return flushSchritt();
  }, function () {

    setNet(false);
    return 'netz';
  });
}
window.addEventListener('online', function () { setNet(true); flush(); });
window.addEventListener('offline', function () { setNet(false); });

var mode = 'bind';

function modusSetzen(neu) {

  if (neu !== 'bind' && pal) palCommit(true);
  mode = neu;
  scanFreigeben();
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (x) {
    x.classList.toggle('sel', x.dataset.mode === neu);
  });
  show($('mBind'), mode === 'bind');
  show($('mShip'), mode === 'ship');
  show($('mStand'), mode === 'stand');

  show($('scanBox'), mode !== 'stand');
  if (mode === 'stand' && stream) stopCam();

  if (mode !== 'ship' && aus && !aus.sende) { aus = null; ausRender(); }
  flashT('', mode);
  if (mode === 'stand') sync();
}

Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
  b.onclick = function () { modusSetzen(b.dataset.mode); };
});

var pal = null;

function palVorhanden(sscc) {
  return (cache.labels || []).filter(function (l) {
    return splitMulti(l.sscc).some(function (x) { return ssccEq(x, sscc); });
  }).map(function (l) {
    return { lid:l.lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid,
             alt:true, shipped:rausHier(l), gesperrt:String(l.status) === '已出货' };
  });
}

function rausHier(l) {
  return String(l.status) === '已出货' && splitMulti(l.sscc).length <= 1;
}

function palZustand(lids) {
  if (!lids.length) return '';
  var raus = lids.filter(function (l) { return l.shipped; }).length;
  return raus === lids.length ? 'shipped' : raus ? 'partial' : '';
}
function zustandAus(status) {
  var st = String(status);
  return st === '已出货' ? 'shipped' : st === '部分出货' ? 'partial' : '';
}

function zeileAus(lid) {
  var l = byLid[lid];
  return l ? { lid:lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid,
               alt:true, shipped:rausHier(l), gesperrt:String(l.status) === '已出货' }
           : { lid:lid, store:'', seq:'', total:'', vid:'', alt:true, shipped:false, gesperrt:false };
}

function filialenVon(lids) {
  var st = {};
  lids.forEach(function (l) { if (l.store) st[l.store] = 1; });
  return Object.keys(st);
}

function zeitWer(p) {
  if (!p) return '';
  var teile = [], d = p.shippedAt ? new Date(p.shippedAt) : null;
  if (d && !isNaN(d.getTime())) {
    var zz = function (x) { return ('0' + x).slice(-2); };
    teile.push(zz(d.getDate()) + '.' + zz(d.getMonth() + 1) + ' ' +
               zz(d.getHours()) + ':' + zz(d.getMinutes()));
  }
  if (p.shippedBy) teile.push(String(p.shippedBy));
  return teile.join(' · ');

function palPruefen(sscc) {

  var mein = pal;
  return mitFrist(apiGet('lookup', { q:sscc }), 10000).then(function (d) {
    if (!d || !d.ok || !d.found || !d.pallet) return;

    var neu = ausstehendRaus(sscc) ? 'shipped' : zustandAus(d.pallet.status);
    if (pal !== mein) {

      if (zustandAus(d.pallet.status) === 'shipped' && mode === 'bind' &&
          ausstehend(sscc).some(function (j) { return j.action === 'bindPallet'; })) {
        flashT('bad', 'palShipped', String(sscc).slice(-6));
      }
      return;
    }
    pal.info = d.pallet;
    if (neu === 'shipped' && pal.zustand !== 'shipped') {

      var verworfen = pal.lids.filter(function (l) { return !l.alt; }).length;
      pal.lids = mitAusstehenden(d.pallet.lids || [], sscc).map(zeileAus);
      pal.weg = [];
      pal.zustand = 'shipped';
      palRender();
      if (mode === 'bind') flashT('bad', 'palShipped', verworfen ? '\u2212' + verworfen : '');
      return;
    }
    var vorher = pal.zustand;
    pal.zustand = neu;
    palRender();
    if (mode === 'bind' && vorher !== neu) {

      else if (vorher === 'shipped') flashT('ok', 'newPal', String(sscc).slice(-6));
    }

}

function palRender() {
  show($('palletBox'), !!pal);
  if (!pal) return;
  var raus = pal.zustand === 'shipped';
  var namen = filialenVon(pal.lids);

  $('storeBig').textContent = namen.length ? namen.join(' / ') : '–';
  $('storeBig').className = 'big' + (raus ? ' versendet' : '');

  var wann = zeitWer(pal.info);
  $('palBanner').className = 'banner' + (pal.zustand === 'partial' ? ' teil' : '');
  $('palBanner').textContent = raus ? t('palShipped') + (wann ? ' · ' + wann : '')
    : pal.zustand === 'partial' ? t('palPartial') : '';
  $('lidList').innerHTML = pal.lids.map(function (l, i) {

    var fest = raus || (l.alt && l.gesperrt);
    return '<div class="row' + (l.alt ? ' alt' : '') + (l.gesperrt ? ' raus' : '') + '">' +
      '<span class="g"><span class="m">' + esc(l.lid) + '</span>' +
      (l.store ? '<div class="s">' + esc(l.store) + ' ' + esc(l.seq) + '/' + esc(l.total) + '</div>' : '') +
      '</span>' + (fest ? '' : '<span class="x" data-rm="' + i + '">&times;</span>') + '</div>';
  }).join('');
  Array.prototype.forEach.call($('lidList').querySelectorAll('[data-rm]'), function (x) {
    x.onclick = function () {
      var i = Number(x.dataset.rm), l = pal.lids[i];
      if (!l) return;

      if (pal.zustand === 'shipped' || (l.alt && l.gesperrt)) { flashT('bad', 'palShipped', l.lid); return; }
      if (cfg.rw === false) { flashT('bad', 'readonly'); return; }

}
function palCommit(silent) {
  if (!pal) return;
  var weg = pal.weg || [];
  var neu = pal.lids.filter(function (l) { return !l.alt; })
                    .map(function (l) { return l.lid; });

  if (!neu.length && !weg.length) { pal = null; palRender(); return; }

  if (weg.length) {
    enqueue({ action:'unbind', body:{ sscc:pal.sscc, lids:weg } });
    cacheLoesen(pal.sscc, weg);
  }
  if (neu.length) {
    enqueue({ action:'bindPallet', body:{ sscc:pal.sscc, lids:neu } });
    cacheBinden(pal.sscc, neu);
  }
  ls(K.cache, cache); reindex();
  if (!silent) {
    if (neu.length) flashT('ok', 'saved', neu.length + (weg.length ? ' −' + weg.length : ''));
    else flashT('ok', 'unbound', weg.length + '');
  }
  pal = null; palRender();
}

var lastText = '', lastAt = 0;

function scanFreigeben(ausser) {
  if (!lastText) return;
  if (ausser) {
    var c = classify(lastText);
    if (c.kind === 'sscc' && ssccEq(c.value, ausser)) return;
  }
  lastText = '';
}

function onScan(text) {
  if (mode === 'stand') return;
  var now = Date.now();

  if (text === lastText && now - lastAt < 2500) { lastAt = now; return; }
  lastText = text; lastAt = now;
  var c = classify(text);
  if (!c.kind) { flashT('bad', 'noRead'); return; }

  if (cfg.oneShot && stream) stopCam();
  if (mode === 'ship') return doShip(c);
  return doBind(c);
}

function doBind(c) {
  if (c.kind === 'sscc') {
    if (pal && ssccEq(pal.sscc, c.value)) { flashT('warn', 'already'); return; }
    if (pal) palCommit(true);
    var vorhanden = palVorhanden(c.value);

    pal = { sscc:c.value, checkOk:c.checkOk, lids:vorhanden, weg:[],
            zustand:ausstehendRaus(c.value) ? 'shipped' : palZustand(vorhanden), info:null };
    palRender();
    if (pal.zustand === 'shipped') flashT('bad', 'palShipped');
    else if (pal.zustand === 'partial') flashT('warn', 'newPal', '', 'palPartial');
    else if (c.checkOk) flashT('ok', 'newPal', c.value.slice(-6));
    else flashT('warn', 'newPal', '', 'check');
    palPruefen(pal.sscc);
    return;
  }
  if (!pal) { flashT('bad', 'needCode'); return; }

  if (cfg.rw === false) { flashT('bad', 'readonly'); return; }

  if (pal.zustand === 'shipped') { flashT('bad', 'palShipped'); return; }
  var l = byLid[c.value];
  if (!l) { flashT('bad', 'unknown', c.value); return; }

  var wi = pal.weg.indexOf(c.value);
  if (wi >= 0) {
    pal.weg.splice(wi, 1);
    pal.lids.push({ lid:l.lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid,
                    alt:true, shipped:rausHier(l), gesperrt:String(l.status) === '已出货' });
    palRender();
    flash('ok', l.store, l.seq + '/' + l.total);
    return;
  }
  if (pal.lids.some(function (x) { return x.lid === c.value; })) { flashT('warn', 'already'); return; }

  var andere = ssccOhne(l.sscc, pal.sscc);
  if (andere.length) { flashT('bad', 'boundElse', String(andere[0]).slice(-6)); return; }
  var fremd = pal.lids.filter(function (x) { return x.store !== l.store; });
  pal.lids.push({ lid:l.lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid });
  palRender();
  if (fremd.length) flashT('warn', 'otherStore', fremd[0].store + ' / ' + l.store);
  else flash('ok', l.store, l.seq + '/' + l.total);
}

var aus = null;

function doShip(c) {
  if (c.kind !== 'sscc') { flashT('bad', 'needCode'); return; }

  if (aus && ssccEq(aus.sscc, c.value)) return;

  if (aus && (aus.pruefen || aus.sende || ausBereit(aus))) {
    flashT('warn', 'shipBusy', aus.sscc.slice(-6));
    return;
  }
  var lids = palVorhanden(c.value);
  var a = aus = { sscc:c.value, checkOk:c.checkOk, lids:lids,
                  zustand:ausstehendRaus(c.value) ? 'shipped' : palZustand(lids),
                  info:null, pruefen:true, sende:false, offline:false, unbekannt:false };
  ausRender();
  if (c.checkOk) flashT('', 'ship', c.value.slice(-6));
  else flashT('warn', 'ship', '', 'check');
  return ausPruefen(a);
}

function ausPruefen(a, nochmal) {
  var vorZustand = a.zustand, vorAnzahl = a.lids.length;
  a.pruefen = true; a.offline = false; a.unbekannt = false; a.mitOffen = false;
  ausRender();

  return mitFrist(flush(), 8000).catch(function () {}).then(function () {
    return mitFrist(apiGet('lookup', { q:a.sscc }), 10000);
  }).then(function (d) {
    if (aus !== a) return;
    if (!d || !d.ok) { a.offline = true; return; }
    if (!d.found || !d.pallet) {

      if (!ausstehend(a.sscc).length) { a.unbekannt = true; a.lids = []; }
      else a.mitOffen = true;
      return;
    }

    a.info = d.pallet;
    a.lids = mitAusstehenden(d.pallet.lids || [], a.sscc).map(zeileAus);
    a.zustand = ausstehendRaus(a.sscc) ? 'shipped' : zustandAus(d.pallet.status);

    a.mitOffen = ausstehend(a.sscc).length > 0;
  }, function () {
    if (aus === a) a.offline = true;
  }).then(function () {
    if (aus !== a) return;
    a.pruefen = false;
    ausRender();
    if (nochmal && !a.unbekannt && a.zustand === vorZustand && a.lids.length === vorAnzahl) return;
    if (a.unbekannt) flashT('bad', 'notFound');
    else if (a.zustand === 'shipped') flashT('bad', 'palShipped');
    else if (!a.lids.length) flashT('bad', a.offline ? 'offline' : 'emptyPal');
  });
}

function ausBereit(a) {
  return !!a && !a.pruefen && !a.sende && !a.unbekannt && cfg.rw !== false &&
         a.zustand !== 'shipped' && a.lids.length > 0;
}

function ausRender() {
  show($('shipBox'), !!aus);
  if (!aus) return;
  var a = aus, raus = a.zustand === 'shipped';
  var namen = filialenVon(a.lids);
  if (!namen.length && a.info && a.info.store) namen = splitMulti(a.info.store);
  $('shipStore').textContent = namen.length ? namen.join(' / ') : '–';
  $('shipStore').className = 'big' + (raus ? ' versendet' : '');
  $('shipSscc').textContent = a.sscc.replace(/(\d{4})(?=\d)/g, '$1 ');

  var text = '', teil = false, wann = zeitWer(a.info), offen = ausstehend(a.sscc).length;
  if (a.unbekannt) text = t('notFound');
  else if (raus) text = t('palShipped') + (wann ? ' · ' + wann : '');
  else if (!a.pruefen && !a.lids.length) { text = t(a.offline ? 'offline' : 'emptyPal'); teil = a.offline; }
  else if (a.zustand === 'partial') { text = t('palPartial'); teil = true; }
  else if (offen) { text = t('pending'); teil = true; }
  else if (a.offline) { text = t('offline'); teil = true; }

  else if (cfg.rw === false) { text = t('readonly'); teil = true; }
  $('shipBanner').className = 'banner' + (teil ? ' teil' : '');
  $('shipBanner').textContent = text;

  $('shipList').innerHTML = a.lids.map(function (l) {
    return '<div class="row' + (l.shipped ? ' raus' : '') + '"><span class="g">' +
      '<span class="m">' + esc(l.lid) + '</span>' +
      (l.store ? '<div class="s">' + esc(l.store) + ' ' + esc(l.seq) + '/' + esc(l.total) + '</div>' : '') +
      '</span></div>';
  }).join('');

  var ok = $('btnShipOk');
  show(ok, !a.unbekannt && !raus && cfg.rw !== false && (a.pruefen || a.lids.length > 0));
  ok.disabled = !ausBereit(a);
  ok.innerHTML = (a.pruefen || a.sende) ? SPINNER : esc(t('confirmShip'));
}

function ausBuchen() {
  var a = aus;
  if (!ausBereit(a)) return Promise.resolve();
  var wo = a.sscc.slice(-6);
  function erledigt(art, key) {
    cacheVersendet(a.sscc);
    ls(K.cache, cache); reindex();
    scanFreigeben(a.sscc);
    if (aus === a) { aus = null; ausRender(); }

    flashT(art, key, wo + ' · ' + a.lids.length);
  }

  if (ausstehend(a.sscc).length) {
    enqueue({ action:'shipPallet', body:{ sscc:a.sscc } });
    erledigt('warn', 'queued');
    return Promise.resolve();
  }
  a.sende = true; ausRender();

  return mitFrist(apiPost('shipPallet', { sscc:a.sscc }), 15000).then(function (d) {
    if (d && d.ok) { erledigt('ok', 'shipDone'); sync(); return; }
    a.sende = false;
    if (aus === a) ausRender();
    if (d && MELDUNG_FUER[d.code]) flashT('bad', MELDUNG_FUER[d.code], wo);
    else if (!d || d.code !== 'auth') flash('bad', (d && (d.error || d.code)) || '', wo);
  }, function () {

    enqueue({ action:'shipPallet', body:{ sscc:a.sscc } });
    erledigt('warn', 'queued');
  });
}

function ausAbbrechen() {
  if (!aus || aus.sende) return;
  scanFreigeben(aus.sscc);
  aus = null; ausRender(); flashT('', 'dropped');
}

var standAuf = {};

function prozent(a, n) { return n ? Math.round(a / n * 1000) / 10 : 0; }

function filialenHtml(liste) {
  var f = {};
  liste.forEach(function (l) { (f[l.store] = f[l.store] || []).push(l); });
  function offen(l) { return l.status === '待绑定'; }
  var namen = Object.keys(f).sort(function (a, b) {
    var oa = f[a].some(offen), ob = f[b].some(offen);
    if (oa !== ob) return oa ? -1 : 1;
    return a.localeCompare(b, 'de');
  });
  return '<div class="fil">' + namen.map(function (name) {
    var z = f[name].slice().sort(function (a, b) { return Number(a.seq) - Number(b.seq); });
    var los = z.filter(offen);
    return '<div class="fz' + (los.length ? ' offen' : '') + '"><span class="g">' + esc(name) + '</span>' +
      los.map(function (l) { return '<span class="chip">' + esc(l.seq) + '/' + esc(l.total) + '</span>'; }).join('') +
      '<span class="zahl">' + (z.length - los.length) + '/' + z.length + '</span></div>';
  }).join('') + '</div>';
}

function renderVerteilungen() {
  var el = $('vList');
  if (!el) return;
  var nachV = {};
  (cache.labels || []).forEach(function (l) { (nachV[l.vid] = nachV[l.vid] || []).push(l); });
  var vs = (cache.verteilungen || []).slice().sort(function (a, b) {
    return String(a.vid).localeCompare(String(b.vid));
  });
  el.innerHTML = vs.map(function (v) {
    var liste = nachV[v.vid] || [], n = liste.length, raus = 0, geb = 0;
    liste.forEach(function (l) {
      if (l.status === '已出货') raus++;
      else if (l.status === '已绑定') geb++;
    });
    var auf = !!standAuf[v.vid];
    return '<div class="vk' + (n && raus + geb === n ? ' fertig' : '') + '" data-vid="' + esc(v.vid) + '">' +
      '<div class="vk-kopf"><span class="pf">' + (auf ? '&#9662;' : '&#9656;') + '</span>' +
      '<span class="m">' + esc(v.vid) + '</span>' +
      '<span class="zahl">' + (raus + geb) + '/' + n + '</span></div>' +
      '<div class="s">' + esc(v.name) + '</div>' +
      '<div class="balken"><i class="raus" style="width:' + prozent(raus, n) + '%"></i>' +
      '<i class="geb" style="width:' + prozent(geb, n) + '%"></i></div>' +
      (auf ? filialenHtml(liste) : '') + '</div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('[data-vid]'), function (k) {
    k.onclick = function () {
      standAuf[k.dataset.vid] = !standAuf[k.dataset.vid];
      renderVerteilungen();
    };
  });
}

var stream = null, detector = null, timer = 0, zx = null, zxCanvas = null;
function hints() {
  var h = new Map();
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128]);
  h.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return h;
}
function nativeDetector() {
  if (!('BarcodeDetector' in window) || typeof window.BarcodeDetector.getSupportedFormats !== 'function') {
    return Promise.resolve(null);
  }
  return window.BarcodeDetector.getSupportedFormats().then(function (f) {
    if (!f || f.indexOf('qr_code') < 0 || f.indexOf('code_128') < 0) return null;
    return new window.BarcodeDetector({ formats:['qr_code','code_128'] });
  }).catch(function () { return null; });
}
function zxDecodeFrame(v) {
  var w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return null;
  var scale = w > 1280 ? 1280 / w : 1;
  var cw = Math.round(w * scale), ch = Math.round(h * scale);
  if (!zxCanvas) zxCanvas = document.createElement('canvas');
  if (zxCanvas.width !== cw || zxCanvas.height !== ch) { zxCanvas.width = cw; zxCanvas.height = ch; }
  zxCanvas.getContext('2d', { willReadFrequently:true }).drawImage(v, 0, 0, cw, ch);
  var src = new ZXing.HTMLCanvasElementLuminanceSource(zxCanvas);
  var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
  try { return zx.decodeWithState(bmp); } catch (e) { return null; }
}
function scanLoop(v) {
  var useNative = !!detector, nativeMiss = 0;
  (function tick() {
    if (!stream) return;
    if (v.readyState < 2 || !v.videoWidth) { timer = setTimeout(tick, 120); return; }
    if (useNative) {
      detector.detect(v).then(function (c) {
        if (c && c.length) { nativeMiss = 0; onScan(c[0].rawValue); }
        else if (++nativeMiss > 60) useNative = false;
      }).catch(function () { useNative = false; }).then(function () {
        if (stream) timer = setTimeout(tick, 180);
      });
      return;
    }
    if (!zx) { zx = new ZXing.MultiFormatReader(); zx.setHints(hints()); }
    var r = zxDecodeFrame(v);
    if (r) onScan(r.getText());
    timer = setTimeout(tick, r ? 400 : 120);
  })();
}

var kameraStartet = false;
function startCam() {
  if (kameraStartet || stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { flashT('bad', 'noCam'); return; }
  kameraStartet = true;
  beep('ok');
  var v = $('video');
  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false
  }).then(function (s) {
    kameraStartet = false;

    if (mode === 'stand') {
      s.getTracks().forEach(function (x) { x.stop(); });
      throw new Error('stand');
    }
    stream = s; v.srcObject = s;
    show($('cam'), true); $('btnCam').textContent = t('camOff');
    return v.play().catch(function () {});
  }).then(nativeDetector).then(function (d) {
    detector = d;
    scanLoop(v);
  }).catch(function (e) {
    kameraStartet = false;
    stopCam();
    if (mode !== 'stand') flashT('bad', 'noCam', (e && e.name) || '');
  });
}
function stopCam() {
  if (timer) { clearTimeout(timer); timer = 0; }
  detector = null;
  if (stream) { stream.getTracks().forEach(function (x) { x.stop(); }); stream = null; }
  $('video').srcObject = null;
  show($('cam'), false); $('btnCam').textContent = t('cam');
}
$('btnCam').onclick = function () { stream ? stopCam() : startCam(); };

$('btnShot').onclick = function () { $('photo').click(); };
$('photo').onchange = function (ev) {
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  flashT('', 'reading');
  var img = new Image();
  img.onload = function () {
    new ZXing.BrowserMultiFormatReader(hints()).decodeFromImageElement(img)
      .then(function (r) { URL.revokeObjectURL(img.src); onScan(r.getText()); })
      .catch(function () { URL.revokeObjectURL(img.src); flashT('bad', 'noRead'); });
  };
  img.src = URL.createObjectURL(f);
};

$('manForm').onsubmit = function (e) {
  e.preventDefault();
  var v = $('manual').value.trim();
  if (!v) return;
  onScan(v); $('manual').value = ''; $('manHint').textContent = '';
};
$('manual').oninput = function () {
  var d = $('manual').value.replace(/[^0-9]/g, '');
  if (d.length >= 18) {
    $('manHint').innerHTML = gs1Ok(d)
      ? '<span style="color:var(--ok)">&#10003;</span>'
      : '<span style="color:var(--bad)">&#10007; ' + esc(t('check')) + '</span>';
  } else {
    $('manHint').textContent = d.length ? d.length + '/18' : '';
  }
};

$('btnCommit').onclick = function () { palCommit(); };
$('btnDrop').onclick = function () { pal = null; palRender(); flashT('', 'dropped'); };
$('btnShipOk').onclick = function () { ausBuchen(); };
$('btnShipNo').onclick = function () { ausAbbrechen(); };

$('btnSync').onclick = function () {
  sync().then(function (ok) { if (ok) flashT('ok', 'reload'); else flashT('bad', 'offline'); });
};
$('lang').onclick = function () { lang = lang === 'zh' ? 'de' : 'zh'; ls(K.lang, lang); applyLang(); };

function openSetup(on) {
  show($('setup'), on); show($('app'), !on);
  if (!on) return;
  $('cfgApi').value = cfg.api;
  $('cfgCode').value = '';
  $('cfgOneShot').checked = !!cfg.oneShot;
  show($('pairBox'), !cfg.tok);
  show($('doneBox'), !!cfg.tok);
  $('meName').textContent = cfg.who || '';
  $('meRole').textContent = cfg.rw ? '' : t('readonly');
}
$('gear').onclick = function () { openSetup($('setup').classList.contains('hide')); };

function setPairBusy(on) {
  pairBusy = on;
  var b = $('cfgPair');
  b.disabled = on;
  b.innerHTML = on ? SPINNER : esc(t('save'));
  $('cfgCode').disabled = on;
  $('cfgApi').disabled = on;
}

$('cfgPair').onclick = function () {
  if (pairBusy) return;
  var api = $('cfgApi').value.trim();
  var code = $('cfgCode').value.trim().toUpperCase();
  if (!apiOk(api) || !code) { $('cfgMsg').textContent = '!'; return; }
  cfg.api = api; ls(K.cfg, cfg);
  $('cfgMsg').textContent = '';
  setPairBusy(true);

  var frist = setTimeout(function () {
    if (!pairBusy) return;
    setPairBusy(false);
    $('cfgMsg').textContent = t('offline');
  }, 30000);
  apiPost('pair', { code:code }).then(function (d) {
    clearTimeout(frist);
    setPairBusy(false);
    if (!d.ok) {
      $('cfgMsg').textContent =
        d.code === 'locked' ? t('locked') :
        d.code === 'toomany' ? t('toomany') : t('codeBad');
      return;
    }
    cfg.tok = d.token; cfg.who = d.who; cfg.rw = !!d.rw;
    ls(K.cfg, cfg);
    boot();
  }).catch(function () {
    clearTimeout(frist);
    setPairBusy(false);
    $('cfgMsg').textContent = t('offline');
  });
};

$('cfgUnpair').onclick = function () {
  cfg.tok = ''; cfg.who = ''; ls(K.cfg, cfg);
  openSetup(true);
};

$('cfgOneShot').onchange = function () { cfg.oneShot = this.checked; ls(K.cfg, cfg); };

$('cfgCode').oninput = function () {
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
};

lang = ls(K.lang) || ((navigator.language || '').slice(0, 2) === 'zh' ? 'zh' : 'de');
function boot() {
  $('who').textContent = cfg.who || '';
  openSetup(false);
  meldung = { kind:'', key:'ready', a:'', b:'', bKey:'' };
  applyLang(); reindex(); queueShow(); sync().then(flush);
}
if (cfg.api && cfg.tok) {
  boot();
} else {
  openSetup(true);
  applyLang();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
