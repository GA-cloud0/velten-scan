    if (!d) { setNet(false); return 'netz'; }

    if (!d.ok && d.code === 'auth') return 'auth';

             job.body && (job.body.lid || job.body.uid) ? String(job.body.lid || job.body.uid) : '';

      if (MELDUNG_FUER[d.code]) flashT('bad', MELDUNG_FUER[d.code], wo);

    }

  var offen = ausstehend(pal.sscc).length;
  var text = '', teil = false;

  if (angenommen) text = t('received') + ' ' + (info.receivedBy || '') + (kurzZeit(info.receivedAt) ? ' ' + kurzZeit(info.receivedAt) : '');
  else if (raus) text = '';
  else if (pal.zustand === 'partial') { text = t('palPartial'); teil = true; }
  else if (offen) { text = t('pending'); teil = true; }
  $('palBanner').className = 'banner' + (teil ? ' teil' : '');
  $('palBanner').textContent = text;
  $('lidList').innerHTML = pal.lids.map(function (l, i) {

    var fest = raus || l.alt;
    return '<div class="row' + (l.alt ? ' alt' : '') + (l.gesperrt ? ' raus' : '') + '">' +
      '<span class="g"><span class="m">' + esc(l.lid) + '</span>' +
      (l.store ? '<div class="s">' + esc(scheinText(l)) + '</div>' : '') +
      '</span>' + (fest ? '' : '<span class="x" data-rm="' + i + '">&times;</span>') + '</div>';
  }).join('');
  Array.prototype.forEach.call($('lidList').querySelectorAll('[data-rm]'), function (x) {
    x.onclick = function () {
      var i = Number(x.dataset.rm), l = pal.lids[i];
      if (!l || l.alt) return;
      pal.lids.splice(i, 1);
      scanFreigeben();
      palRender();
    };
  });
  var ok = $('btnCommit');
  if (raus) {
    show(ok, !angenommen && darf('unshipPallet'));
    ok.className = 'b rot';
    ok.disabled = false;
    ok.textContent = t('unship');
  } else {
    show(ok, darf('bindShip'));
    ok.className = 'b';
    ok.disabled = !pal.lids.length;
    ok.textContent = t('confirmShip');
  }
  $('btnDrop').textContent = t(raus ? 'close' : 'cancel');
}

function palBuchen() {
  var p = pal;
  if (!p) return;
  var raus = p.zustand === 'shipped';
  if (!raus && !p.lids.length) return;
  var job = raus ? { action:'unshipPallet', body:{ sscc:p.sscc } }
                 : { action:'bindShip', body:{ sscc:p.sscc, lids:palNeu(p).map(function (l) { return l.lid; }) } };
  var ungepickt = raus ? 0 : p.lids.filter(function (l) { return !istUm(l.lid) && !gepickt(l.lid); }).length;
  var namen = filialenVon(p.lids);
  if (!namen.length && p.info && p.info.store) namen = splitMulti(p.info.store);
  enqueue(job);
  cacheAnwenden(job);
  ls(K.cache, cache); reindex();
  scanFreigeben([p.sscc].concat(p.lids.map(function (l) { return l.lid; })));
  pal = null; palRender();
  flash(raus || ungepickt ? 'warn' : 'ok', namen.join(' / ') || p.sscc.slice(-6),
        t(raus ? 'unshipDone' : 'shipDone') + '  ' + p.sscc.slice(-6) +
        (raus ? '' : ' (' + p.lids.length + ')') + (ungepickt ? '  ' + t('notPicked') + ' ' + ungepickt : ''));
}

function palAbbrechen() {
  if (!pal) return;
  scanFreigeben([pal.sscc].concat(pal.lids.map(function (l) { return l.lid; })));
  pal = null; palRender(); flashT('', 'dropped');
}

var lastText = '', lastAt = 0;

function scanFreigeben(ausser) {
  if (!lastText) return;
  if (ausser) {

    var c = classify(lastText), liste = [].concat(ausser);
    for (var i = 0; i < liste.length; i++) {
      if (c.kind === 'sscc' && ssccEq(c.value, liste[i])) return;
      if (c.kind === 'lid' && c.value === String(liste[i]).toUpperCase()) return;
    }
  }
  lastText = '';
}

function onScan(text) {
  if (mode === 'stand') return;
  var now = Date.now();

  if (text === lastText && now - lastAt < 2500) { lastAt = now; return; }
  lastText = text; lastAt = now;
  var c = classify(text);
  if (!c.kind) { flashT('bad', 'noRead'); return; }

  if (stream) stopCam();
  if (mode === 'pick') return doPick(c);
  if (mode === 'recv') return doRecv(c);
  return doBind(c);
}

function doBind(c) {
  if (c.kind === 'sscc') {
    if (pal && ssccEq(pal.sscc, c.value)) { flashT('warn', 'already'); return; }

    if (pal && palNeu(pal).length) { flashT('warn', 'shipBusy', pal.sscc.slice(-6)); return; }
    var vorhanden = palVorhanden(c.value);
    pal = { sscc:c.value, checkOk:c.checkOk, lids:vorhanden, info:null,
            zustand:palZustandMit(c.value, palZustand(vorhanden)) };
    palRender();
    if (pal.zustand === 'shipped') flashT('warn', 'shipped');
    else if (pal.zustand === 'partial') flashT('warn', 'newPal', '', 'palPartial');
    else if (c.checkOk) flashT('ok', 'newPal', c.value.slice(-6));
    else flashT('warn', 'newPal', '', 'check');
    palPruefen(pal.sscc);
    return;
  }
  if (!pal) { flashT('bad', 'needCode'); return; }

  if (!darf('bindShip')) { flashT('bad', 'forbidden'); return; }

  if (pal.zustand === 'shipped') { flashT('bad', 'palShipped'); return; }
  var l = byLid[c.value];
  if (!l) { flashT('bad', 'unknown', c.value); return; }
  if (pal.lids.some(function (x) { return x.lid === c.value; })) { flashT('warn', 'already'); return; }

  var andere = ssccOhne(l.sscc, pal.sscc);
  if (andere.length) { flashT('bad', 'boundElse', String(andere[0]).slice(-6)); return; }
  var fremd = pal.lids.filter(function (x) { return x.store !== l.store; });
  pal.lids.push({ lid:l.lid, store:l.store, seq:l.seq, total:l.total, vid:l.vid, name:l.name, kartons:l.kartons });
  palRender();
  var liste = listenName(l.vid);
  if (fremd.length) flashT('warn', 'otherStore', fremd[0].store + ' / ' + l.store);

  else if (istUm(l.lid)) flash('ok', l.store, t('transfer') + (l.name ? '  ' + l.name : ''));

  else if (!gepickt(l.lid)) flash('warn', l.store, l.seq + '/' + l.total + kartonText(l.kartons) + '  ' + t('notPicked'));
  else flash('ok', l.store, l.seq + '/' + l.total + kartonText(l.kartons) + (liste ? '  ' + liste : ''));
}

var pk = null, pkZuletzt = null;

function pickAusstehend(lid) {
  var letzte = '';
  queue.forEach(function (j) {
    if (!j.body || j.body.lid !== lid) return;
    if (j.action === 'pickLabel') letzte = 'an';
    if (j.action === 'unpickLabel') letzte = 'ab';
  });
  return letzte;
}
function gepickt(lid) {
  var l = byLid[lid], unterwegs = pickAusstehend(lid);
  if (unterwegs) return unterwegs === 'an';
  return !!l && (!!l.pickedAt || String(l.status) === '已抓货');
}

function doPick(c) {
  if (c.kind !== 'lid') { flashT('bad', 'needQr'); return; }
  if (istUm(c.value)) { flashT('bad', 'noPickUm', c.value); return; }

  if (pkZuletzt && pkZuletzt.lid === c.value && Date.now() - pkZuletzt.at < EMP_SCHONFRIST) return;
  if (pk) {
    if (pk.lid === c.value) return;

    if (pk.art === 'annehmen' || pk.art === 'stornieren') { flashT('warn', 'shipBusy', pk.lid.slice(-6)); return; }
  }
  if (byLid[c.value]) return pickZeigen(byLid[c.value]);

  var lid = c.value;
  flashT('', 'reading');
  return sync(true).then(function () {
    if (pk) return;
    if (byLid[lid]) pickZeigen(byLid[lid]);
    else flashT('bad', 'unknown', lid);
  });
}

function pickArt(l) {
  if (String(l.status) === '已出货') return 'info';
  var eigen = pickAusstehend(l.lid);
  if (eigen) return eigen === 'an' ? 'stornieren' : 'annehmen';
  if (l.pickedAt && l.fremd) return 'fremd';
  return gepickt(l.lid) ? 'stornieren' : 'annehmen';
}

function pickMelden(p) {
  var l = p.l;
  if (p.art === 'info') flashT('bad', 'palShipped', l.lid.slice(-6));
  else if (p.art === 'fremd') flashT('bad', 'pickedElse', wannWer(l.pickedBy, l.pickedAt));
  else if (p.art === 'stornieren') flashT('warn', 'pickUndoAsk');
  else flash('', l.store, l.seq + '/' + l.total + kartonText(l.kartons));
}

function wannWer(wer, wann) {
  return String(wer || '') + (kurzZeit(wann) ? ' ' + kurzZeit(wann) : '');
}

function pickZeigen(l) {
  pk = { lid:l.lid, l:l, art:pickArt(l), zeit:new Date().toISOString() };
  pickRender();
  pickMelden(pk);
  pickPruefen(pk);
}

function pickPruefen(p) {
  if (p.art === 'info' || pickAusstehend(p.lid)) return Promise.resolve();
  return mitFrist(apiGet('lookup', { q:p.lid }), 4000).then(function (d) {
    if (pk !== p || !d || !d.ok || !d.found || !d.label) return;
    labelUebernehmen(d.label);
    pickNachladen();
  }).catch(function () {});
}

function pickNachladen() {
  if (!pk || !byLid[pk.lid]) return;
  var vorher = pk.art;
  pk.l = byLid[pk.lid];
  pk.art = pickArt(pk.l);
  if (pk.art !== vorher) { pickRender(); pickMelden(pk); }
}

function pickRender() {
  show($('pickBox'), !!pk);
  if (!pk) return;
  var l = pk.l, liste = listenName(l.vid);
  $('pickStore').textContent = l.store || '–';
  $('pickStore').className = 'big' + (pk.art === 'info' || pk.art === 'fremd' ? ' versendet' : '');
  $('pickCont').textContent = liste;
  $('pickNr').textContent = l.lid + '  ' + l.seq + '/' + l.total + kartonText(l.kartons);
  var text = '', teil = false;
  if (pk.art === 'info') text = t('palShipped');
  else if (pk.art === 'fremd') text = t('pickedElse') + ': ' + wannWer(l.pickedBy, l.pickedAt);
  else if (pk.art === 'stornieren') {
    text = t('pickUndoAsk') + (kurzZeit(l.pickedAt) ? ' ' + kurzZeit(l.pickedAt) : '');
    teil = true;
  }
  $('pickBanner').className = 'banner' + (teil ? ' teil' : '');
  $('pickBanner').textContent = text;
  var knopf = pk.art === 'annehmen' ? 'pickConfirm' : pk.art === 'stornieren' ? 'pickUndo' : '';
  var ok = $('btnPickOk');
  show(ok, !!knopf);
  ok.className = 'b' + (pk.art === 'stornieren' ? ' rot' : '');
  ok.textContent = t(knopf || 'pickConfirm');
  $('btnPickNo').textContent = t(knopf ? 'cancel' : 'close');
}

function pickBuchen() {
  var p = pk;
  if (!p || (p.art !== 'annehmen' && p.art !== 'stornieren')) return;
  var an = p.art === 'annehmen';
  var job = { action:an ? 'pickLabel' : 'unpickLabel', body:{ lid:p.lid, scannedAt:p.zeit } };
  enqueue(job);
  cacheAnwenden(job);
  ls(K.cache, cache); reindex();
  pkZuletzt = { lid:p.lid, at:Date.now() };
  scanFreigeben([p.lid]);
  pk = null; pickRender();
  flash(an ? 'ok' : 'warn', p.l.store, t(an ? 'pickDone' : 'pickUndone') + '  ' + p.l.seq + '/' + p.l.total +
        kartonText(p.l.kartons));
}

function pickAbbrechen() {
  if (!pk) return;
  scanFreigeben([pk.lid]);
  pk = null; pickRender(); flashT('', 'dropped');
}

var emp = null;

var EMP_SCHONFRIST = 8000;
var empZuletzt = null;
var empLokal = ls(K.empfang) || {};

function empLokalMerken(sscc, eintrag) {
  var k = ssccCore(sscc);
  if (eintrag) empLokal[k] = eintrag; else delete empLokal[k];

  var grenze = Date.now() - 30 * 86400000;
  Object.keys(empLokal).forEach(function (x) {
    if (!empLokal[x] || new Date(empLokal[x].at).getTime() < grenze) delete empLokal[x];
  });
  ls(K.empfang, empLokal);
}

function gehoertZu(c, x) {
  if (!x) return false;
  if (c.kind === 'sscc') return !!x.sscc && ssccEq(c.value, x.sscc);
  return (x.lids || []).indexOf(c.value) >= 0;
}

function empAusstehend(sscc) {
  var letzte = '';
  ausstehend(sscc).forEach(function (j) {
    if (j.action === 'receivePallet') letzte = 'an';
    if (j.action === 'unreceivePallet') letzte = 'ab';
  });
  return letzte;
}

function umAusstehend(uid) {
  var letzte = '';
  queue.forEach(function (j) {
    if (!j.body || j.body.uid !== uid) return;
    if (j.action === 'receiveUmlagerung') letzte = 'an';
    if (j.action === 'unreceiveUmlagerung') letzte = 'ab';
  });
  return letzte;
}

function kurzZeit(wert) {
  var d = wert ? new Date(wert) : null;
  if (!d || isNaN(d.getTime())) return '';
  var zz = function (x) { return ('0' + x).slice(-2); };
  return zz(d.getDate()) + '.' + zz(d.getMonth() + 1) + ' ' + zz(d.getHours()) + ':' + zz(d.getMinutes());
}

function doRecv(c) {
  if (c.kind !== 'sscc' && c.kind !== 'lid') return;

  if (empZuletzt && Date.now() - empZuletzt.at < EMP_SCHONFRIST && gehoertZu(c, empZuletzt)) return;
  if (emp) {
    if (gehoertZu(c, emp)) {
      if (emp.art !== 'sammeln') return;
      if (c.kind === 'sscc') {

        emp.art = 'annehmen';
      } else {
        emp.gesehen[c.value] = true;
        if (emp.lids.every(function (l) { return emp.gesehen[l]; })) emp.art = 'annehmen';
      }
      empRender();
      flash(emp.art === 'annehmen' ? 'ok' : '', splitMulti(emp.store).join(' / '), empStand(emp));
      return;
    }

    if (emp.art !== 'info' || emp.pruefen || emp.sende) {
      flashT('warn', 'shipBusy', (emp.sscc || emp.code).slice(-6));
      return;
    }
  }
  return empPruefen(c);
}

function empStand(e) {
  var n = e.lids.filter(function (l) { return e.gesehen[l]; }).length;
  return n + '/' + e.lids.length;
}

function empPruefen(c) {
  var e = emp = { art:'pruefen', code:c.value, sscc:c.kind === 'sscc' ? c.value : '', lids:[],
                  store:'', gesehen:{}, info:null, pruefen:true, sende:false, offline:false,
                  zeit:new Date().toISOString() };
  if (c.kind === 'lid') e.gesehen[c.value] = true;
  empRender();
  flashT('', 'recv', c.value.slice(-6));

  return mitFrist(flush(), 8000).catch(function () {}).then(function () {
    return mitFrist(apiGet('receiveInfo', { q:c.value }), 10000);
  }).then(function (d) {
    if (emp !== e) return;
    e.pruefen = false;
    if (!d) throw new Error('netz');
    if (!d.ok) {
      emp = null; empRender();
      if (d.code !== 'auth') flash('bad', d.error || d.code || '', c.value.slice(-6));
      return;
    }

    var nichtRaus = d.found ? d.ohnePalette || (d.pallet && !d.pallet.shipped && !d.pallet.receivedAt)
                            : d.kind === 'pallet';
    if (nichtRaus) { emp = null; empRender(); flashT('bad', 'recvNotShipped', c.value.slice(-6)); return; }
    if (!d.found) { emp = null; empRender(); flashT('bad', 'notFound', c.value.slice(-6)); return; }
    if (d.umlagerung) { empUmlagerung(e, d.umlagerung); return; }
    if (d.mehrdeutig || !d.pallet) {
      emp = null; empRender(); flashT('bad', 'recvUseBarcode', c.value.slice(-6)); return;
    }
    var p = d.pallet;
    e.info = p; e.sscc = p.sscc; e.store = p.store; e.lids = p.lids || [];
    var unterwegs = empAusstehend(e.sscc);
    var meins = unterwegs ? unterwegs === 'an' : (!!p.receivedAt && p.mine);
    if (meins) e.art = 'stornieren';
    else if (p.receivedAt && !p.mine && unterwegs !== 'ab') e.art = 'info';
    else if (c.kind === 'lid' && e.lids.length > 1) e.art = 'sammeln';
    else e.art = 'annehmen';
    empRender();
    if (e.art === 'info') flashT('bad', 'recvElse', p.receivedBy);
    else if (e.art === 'stornieren') flashT('warn', 'recvUndoAsk');
    else flash(e.art === 'annehmen' ? 'ok' : '', splitMulti(e.store).join(' / ') || '–',
               e.art === 'sammeln' ? empStand(e) : e.lids.length + '');
  }).catch(function () {
    if (emp !== e) return;
    e.pruefen = false;

    if (c.kind === 'lid') { emp = null; empRender(); flashT('bad', 'recvNeedNet'); return; }
    e.offline = true;
    var hier = empLokal[ssccCore(e.sscc)], unterwegs2 = empAusstehend(e.sscc);
    var meins2 = unterwegs2 ? unterwegs2 === 'an' : !!hier;
    e.art = meins2 ? 'stornieren' : 'annehmen';
    if (hier) { e.store = hier.store || ''; e.container = hier.container || ''; }
    empRender();
    flashT('warn', 'offlineNoCheck');
  });
}

function empUmlagerung(e, u) {
  e.info = u; e.uid = u.uid; e.name = u.name || u.uid; e.lids = [u.uid];
  var unterwegs = umAusstehend(u.uid);
  var meins = unterwegs ? unterwegs === 'an' : (!!u.receivedAt && u.mine);
  if (meins) e.art = 'stornieren';
  else if (u.receivedAt && !u.mine && unterwegs !== 'ab') e.art = 'info';
  else e.art = 'annehmen';
  empRender();
  if (e.art === 'info') flashT('bad', 'recvElse', u.receivedBy);
  else if (e.art === 'stornieren') flashT('warn', 'recvUndoAsk');
  else flash('ok', e.name, t('transfer'));
}

function riesig(text) {
  var woerter = String(text || '').split(/\s+/);
  var n = Math.max(3, Math.max.apply(null, woerter.map(function (w) { return w.length; })));
  return 'min(28vw, ' + (150 / n).toFixed(1) + 'vw)';
}

function empRender() {
  var voll = !!emp && emp.art !== 'sammeln';
  $('recvBox').classList.toggle('voll', voll);
  show($('recvBox'), !!emp);
  if (!emp) return;
  var e = emp, p = e.info || {};
  var name = e.uid ? e.name : e.store ? splitMulti(e.store).join(' / ') : '–';
  $('recvCont').textContent = e.uid ? t('transfer') : p.container || e.container || '';
  $('recvStore').textContent = name;
  $('recvStore').style.fontSize = voll ? riesig(name) : '';
  $('recvSscc').textContent = e.sscc ? e.sscc.replace(/(\d{4})(?=\d)/g, '$1 ') : e.code;

  var text = '', teil = false;
  if (e.art === 'info') {
    text = t('recvElse') + ': ' + (p.receivedBy || '') + (kurzZeit(p.receivedAt) ? ' ' + kurzZeit(p.receivedAt) : '');
  } else if (e.art === 'stornieren') {
    text = t('recvUndoAsk') + (kurzZeit(p.receivedAt) ? ' ' + kurzZeit(p.receivedAt) : '');
    teil = true;
  } else if (e.offline) {
    text = t('offlineNoCheck'); teil = true;
  } else if (e.info && !e.uid && !p.shipped) {
    text = t('recvNotShipped'); teil = true;
  }
  $('recvBanner').className = 'banner' + (teil ? ' teil' : '');
  $('recvBanner').textContent = text;

  var schein = {};
  (p.scheine || []).forEach(function (s) { schein[s.lid] = s; });
  $('recvList').innerHTML = e.lids.map(function (lid) {
    var ja = e.art === 'sammeln' ? !!e.gesehen[lid] : null, s = schein[lid];
    return '<div class="row"><span class="g"><span class="m">' + esc(lid) + '</span>' +
      (s && s.kartons ? '<div class="s">' + (s.frisch ? FRISCH + ' ' : '') + esc(s.kartons + ' ' + t('kartons')) + '</div>' : '') +
      '</span>' +
      (ja === null ? '' : '<span class="' + (ja ? 'ok' : 'offen') + '">' + (ja ? '&#10003;' : '&#9675;') + '</span>') +
      '</div>';
  }).join('');

  var knopf = e.art === 'annehmen' ? 'recvConfirm' : e.art === 'stornieren' ? 'recvUndo' : '';
  var ok = $('btnRecvOk');
  show(ok, !!knopf || e.pruefen);
  ok.disabled = e.pruefen || e.sende || !knopf;
  ok.className = 'b' + (e.art === 'stornieren' ? ' rot' : '');
  ok.innerHTML = (e.pruefen || e.sende) ? SPINNER : esc(t(knopf || 'recvConfirm'));
  $('btnRecvNo').textContent = t(e.art === 'info' ? 'close' : 'cancel');
}

function empBuchen() {
  var e = emp;
  if (!e || e.pruefen || e.sende || (e.art !== 'annehmen' && e.art !== 'stornieren')) return Promise.resolve();
  var an = e.art === 'annehmen';
  var aktion = e.uid ? (an ? 'receiveUmlagerung' : 'unreceiveUmlagerung') : (an ? 'receivePallet' : 'unreceivePallet');
  var body = e.uid ? { uid:e.uid, scannedAt:e.zeit } : { sscc:e.sscc, scannedAt:e.zeit };
  var wo = (e.uid || e.sscc).slice(-6);
  function erledigt(art, key) {

    if (!e.uid) empLokalMerken(e.sscc, an ? { at:e.zeit, store:e.store, container:(e.info && e.info.container) || e.container || '' } : null);
    empZuletzt = { sscc:e.sscc, lids:e.lids.slice(), at:Date.now() };
    scanFreigeben([e.uid || e.sscc].concat(e.lids));
    if (emp === e) { emp = null; empRender(); }
    flash(art, e.uid ? e.name : splitMulti(e.store).join(' / ') || wo, t(key));
  }

  if (e.offline || (e.uid ? umAusstehend(e.uid) : ausstehend(e.sscc).length)) {
    enqueue({ action:aktion, body:body });
    erledigt('warn', 'queued');
    return Promise.resolve();
  }
  e.sende = true; empRender();
  return mitFrist(apiPost(aktion, body), 15000).then(function (d) {
    if (d && d.ok) { erledigt('ok', an ? 'recvDone' : 'recvUndone'); return; }
    e.sende = false;

    if (d && (d.code === 'received_elsewhere' || d.code === 'not_mine') && (d.pallet || d.umlagerung) && emp === e) {
      e.info = d.pallet || d.umlagerung; e.art = 'info';
    }

    if (d && d.code === 'not_shipped' && emp === e) { emp = null; empRender(); }
    if (emp === e) empRender();
    if (d && MELDUNG_FUER[d.code]) flashT('bad', MELDUNG_FUER[d.code], wo);
    else if (!d || d.code !== 'auth') flash('bad', (d && (d.error || d.code)) || '', wo);
  }, function () {

    enqueue({ action:aktion, body:body });
    erledigt('warn', 'queued');
  });
}

function empAbbrechen() {
  if (!emp || emp.sende) return;

  scanFreigeben([emp.sscc || emp.code].concat(emp.lids, [emp.code]));
  emp = null; empRender(); flashT('', 'dropped');
}

var standAuf = {};

function prozent(a, n) { return n ? Math.round(a / n * 1000) / 10 : 0; }

function standZahlen(liste) {
  var raus = 0, gepickt = 0;
  liste.forEach(function (l) {
    if (l.status === '已出货') raus++;
    if (l.status !== '待绑定') gepickt++;
  });
  return { n: liste.length, raus: raus, gepickt: gepickt };
}
function zahlHtml(key, a, n) {
  return '<span class="zahl' + (n && a === n ? ' voll' : '') + '">' + esc(t(key)) + ' ' + a + '/' + n + '</span>';
}

function filialenHtml(liste) {
  var f = {};
  liste.forEach(function (l) { (f[l.store] = f[l.store] || []).push(l); });
  function offen(l) { return l.status === '待绑定'; }
  var namen = Object.keys(f).sort(function (a, b) {
    var oa = f[a].some(offen), ob = f[b].some(offen);
    if (oa !== ob) return oa ? -1 : 1;
    return a.localeCompare(b, 'de');
  });
  return '<div class="fil">' + namen.map(function (name) {
    var z = f[name].slice().sort(function (a, b) { return Number(a.seq) - Number(b.seq); });
    var los = z.filter(offen), zahlen = standZahlen(z);
    return '<div class="fz' + (los.length ? ' offen' : '') + '"><span class="g">' + esc(name) + '</span>' +
      los.map(function (l) { return '<span class="chip">' + esc(l.seq) + '/' + esc(l.total) + '</span>'; }).join('') +
      zahlHtml('pick', zahlen.gepickt, zahlen.n) + zahlHtml('bind', zahlen.raus, zahlen.n) + '</div>';
  }).join('') + '</div>';
}

function vidVergleich(a, b) {
  a = String(a); b = String(b);
  return a.slice(0, 4).localeCompare(b.slice(0, 4)) || a.length - b.length || a.localeCompare(b);
}

function renderVerteilungen() {
  var el = $('vList');
  if (!el) return;
  var nachV = {};
  (cache.labels || []).forEach(function (l) { (nachV[l.vid] = nachV[l.vid] || []).push(l); });
  var vs = (cache.verteilungen || []).slice().sort(function (a, b) { return vidVergleich(a.vid, b.vid); });
  el.innerHTML = vs.map(function (v) {
    var liste = nachV[v.vid] || [], z = standZahlen(liste), n = z.n;
    var auf = !!standAuf[v.vid];
    return '<div class="vk" data-vid="' + esc(v.vid) + '">' +
      '<div class="vk-kopf"><span class="pf">' + (auf ? '&#9662;' : '&#9656;') + '</span>' +
      '<span class="m">' + esc(v.vid) + '</span>' +
      '<span class="zahlen">' + zahlHtml('pick', z.gepickt, n) + zahlHtml('bind', z.raus, n) + '</span></div>' +
      '<div class="s">' + (v.frisch ? FRISCH + ' ' : '') + esc(v.name) + '</div>' +
      '<div class="balken"><i class="raus" style="width:' + prozent(z.raus, n) + '%"></i>' +
      '<i class="geb" style="width:' + prozent(z.gepickt - z.raus, n) + '%"></i></div>' +
      (auf ? filialenHtml(liste) : '') + '</div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('[data-vid]'), function (k) {
    k.onclick = function () {
      standAuf[k.dataset.vid] = !standAuf[k.dataset.vid];
      renderVerteilungen();
    };
  });
}

var stream = null, detector = null, timer = 0, zx = null, zxCanvas = null;

var scanSeit = 0, scanTipp = false, SCAN_TIPP_MS = 6000;

var spur = null, zoomAn = false, zoomOptisch = null, lichtAn = false;

function hints() {
  var h = new Map();
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128]);
  h.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return h;
}
function nativeDetector() {
  if (!('BarcodeDetector' in window) || typeof window.BarcodeDetector.getSupportedFormats !== 'function') {
    return Promise.resolve(null);
  }
  return window.BarcodeDetector.getSupportedFormats().then(function (f) {
    if (!f || f.indexOf('qr_code') < 0 || f.indexOf('code_128') < 0) return null;
    return new window.BarcodeDetector({ formats:['qr_code','code_128'] });
  }).catch(function () { return null; });
}

function zxLesen(v, a, dw, filter) {
  var dh = Math.round(a.h * dw / a.w);
  if (!zxCanvas) zxCanvas = document.createElement('canvas');
  if (zxCanvas.width !== dw || zxCanvas.height !== dh) { zxCanvas.width = dw; zxCanvas.height = dh; }
  var g = zxCanvas.getContext('2d', { willReadFrequently:true });
  g.drawImage(v, a.x, a.y, a.w, a.h, 0, 0, dw, dh);
  if (filter) filter(g, dw, dh);
  var src = new ZXing.HTMLCanvasElementLuminanceSource(zxCanvas);
  var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
  try { return zx.decodeWithState(bmp); } catch (e) { return null; }
}
function ausschnitt(w, h, anteil) {
  var aw = Math.round(w * anteil), ah = Math.round(h * anteil);
  return { x:Math.round((w - aw) / 2), y:Math.round((h - ah) / 2), w:aw, h:ah };
}

function zxGanz(v) {
  var a = ausschnitt(v.videoWidth, v.videoHeight, zoomAn && !zoomOptisch ? 0.5 : 1);
  return zxLesen(v, a, Math.min(a.w, 1280), null);
}

function zxMitte(v, entspiegelt) {
  var a = ausschnitt(v.videoWidth, v.videoHeight, zoomAn && !zoomOptisch ? 0.35 : 0.6);
  return zxLesen(v, a, Math.min(a.w, 1600), entspiegelt ? entspiegeln : null);
}

var ENTSPIEGEL_K = 5;
function entspiegeln(g, w, h) {
  var bild = g.getImageData(0, 0, w, h), d = bild.data, n = w * h;
  var grau = new Uint8Array(n), tmp = new Uint8Array(n), r = (ENTSPIEGEL_K - 1) >> 1;
  var x, y, k, i, m, v, y0, y1;
  for (i = 0; i < n; i++) grau[i] = (d[i * 4] * 77 + d[i * 4 + 1] * 151 + d[i * 4 + 2] * 28) >> 8;
  for (y = 0; y < h; y++) {
    y0 = Math.max(0, y - r); y1 = Math.min(h - 1, y + r);
    for (x = 0; x < w; x++) {
      m = 255;
      for (k = y0; k <= y1; k++) { v = grau[k * w + x]; if (v < m) m = v; }
      tmp[y * w + x] = m;
    }
  }
  for (y = 0; y < h; y++) {
    y0 = Math.max(0, y - r); y1 = Math.min(h - 1, y + r);
    for (x = 0; x < w; x++) {
      m = 0;
      for (k = y0; k <= y1; k++) { v = tmp[k * w + x]; if (v > m) m = v; }
      i = (y * w + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = m;
    }
  }
  g.putImageData(bild, 0, 0);
}

function scanLoop(v) {
  var schritt = 0, zxN = 0;
  scanSeit = Date.now(); scanTipp = false;
  function treffer(text) { scanSeit = Date.now(); onScan(text); }

  function zxVersuch() {
    if (!zx) { zx = new ZXing.MultiFormatReader(); zx.setHints(hints()); }
    zxN++;
    var r = zxN % 2 ? zxMitte(v, zxN % 8 === 7) : zxGanz(v);
    if (r) treffer(r.getText());
    return !!r;
  }
  function tipp() {
    if (!scanTipp && Date.now() - scanSeit > SCAN_TIPP_MS) { scanTipp = true; flashT('', 'tipGlare'); }
  }
  (function tick() {
    if (!stream) return;
    if (v.readyState < 2 || !v.videoWidth) { timer = setTimeout(tick, 120); return; }
    schritt++;
    tipp();
    if (detector) {

      detector.detect(v).then(function (c) {
        if (c && c.length) treffer(c[0].rawValue);
        else if (schritt % 2 === 0) zxVersuch();
      }).catch(function () { detector = null; }).then(function () {
        if (stream) timer = setTimeout(tick, 150);
      });
      return;
    }
    var r = zxVersuch();
    timer = setTimeout(tick, r ? 400 : 100);
  })();
}

function kameraKnoepfe() {
  var caps = {};
  try { caps = spur && spur.getCapabilities ? spur.getCapabilities() || {} : {}; } catch (e) {}
  zoomOptisch = caps.zoom && caps.zoom.max > 1 ? caps.zoom : null;
  zoomAn = false; lichtAn = false;
  show($('btnZoom'), true);
  show($('btnTorch'), caps.torch === true);
  kameraZeigen();
}
function kameraZeigen() {
  $('btnZoom').classList.toggle('an', zoomAn);
  $('btnTorch').classList.toggle('an', lichtAn);
  $('video').style.transform = zoomAn && !zoomOptisch ? 'scale(2)' : '';
}
function spurSetzen(was) {
  if (!spur || !spur.applyConstraints) return Promise.resolve();
  return spur.applyConstraints({ advanced:[was] }).catch(function () {});
}
$('btnZoom').onclick = function () {
  zoomAn = !zoomAn;
  if (zoomOptisch) spurSetzen({ zoom: zoomAn ? Math.min(2, zoomOptisch.max) : (zoomOptisch.min || 1) });
  kameraZeigen();
};
$('btnTorch').onclick = function () {
  lichtAn = !lichtAn;
  spurSetzen({ torch: lichtAn });
  kameraZeigen();
};

var kameraStartet = false;
function startCam() {
  if (kameraStartet || stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { flashT('bad', 'noCam'); return; }
  kameraStartet = true;
  beep('ok');
  var v = $('video');

  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal:'environment' }, width:{ ideal:3840 }, height:{ ideal:2160 } }, audio:false
  }).then(function (s) {
    kameraStartet = false;

    if (mode === 'stand') {
      s.getTracks().forEach(function (x) { x.stop(); });
      throw new Error('stand');
    }
    stream = s; v.srcObject = s;
    spur = s.getVideoTracks ? s.getVideoTracks()[0] || null : null;
    kameraKnoepfe();
    show($('cam'), true); $('btnCam').textContent = t('camOff');
    return v.play().catch(function () {});
  }).then(nativeDetector).then(function (d) {
    detector = d;
    scanLoop(v);
  }).catch(function (e) {
    kameraStartet = false;
    stopCam();
    if (mode !== 'stand') flashT('bad', 'noCam', (e && e.name) || '');
  });
}
function stopCam() {
  if (timer) { clearTimeout(timer); timer = 0; }
  detector = null;
  if (stream) { stream.getTracks().forEach(function (x) { x.stop(); }); stream = null; }
  spur = null; zoomAn = false; lichtAn = false;
  $('video').srcObject = null;
  $('video').style.transform = '';
  show($('btnZoom'), false); show($('btnTorch'), false);
  show($('cam'), false); $('btnCam').textContent = t('cam');
}
$('btnCam').onclick = function () { stream ? stopCam() : startCam(); };

$('btnShot').onclick = function () { $('photo').click(); };
$('photo').onchange = function (ev) {
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  flashT('', 'reading');
  var img = new Image();
  img.onload = function () {
    new ZXing.BrowserMultiFormatReader(hints()).decodeFromImageElement(img)
      .then(function (r) { URL.revokeObjectURL(img.src); onScan(r.getText()); })
      .catch(function () { URL.revokeObjectURL(img.src); flashT('bad', 'noRead'); });
  };
  img.src = URL.createObjectURL(f);
};

$('manForm').onsubmit = function (e) {
  e.preventDefault();
  var v = $('manual').value.trim();
  if (!v) return;
  onScan(v); $('manual').value = ''; $('manHint').textContent = '';
};
$('manual').oninput = function () {
  var roh = $('manual').value, d = roh.replace(/[^0-9]/g, ''), c = classify(roh);

  if (c.kind === 'lid') { $('manHint').textContent = c.value; return; }
  if (d.length >= 18) {
    $('manHint').innerHTML = gs1Ok(d)
      ? '<span style="color:var(--ok)">&#10003;</span>'
      : '<span style="color:var(--bad)">&#10007; ' + esc(t('check')) + '</span>';
  } else {
    $('manHint').textContent = d.length ? d.length + '/18' : '';
  }
};

$('btnCommit').onclick = function () { palBuchen(); };
$('btnDrop').onclick = function () { palAbbrechen(); };
$('btnPickOk').onclick = function () { pickBuchen(); };
$('btnPickNo').onclick = function () { pickAbbrechen(); };
$('btnRecvOk').onclick = function () { empBuchen(); };
$('btnRecvNo').onclick = function () { empAbbrechen(); };

$('btnSync').onclick = function () {
  if (laedt) return;
  var b = $('btnSync');
  laedt = true;
  b.disabled = true;
  b.innerHTML = SPINNER;
  sync(true).then(function (ok) {
    laedt = false;
    b.disabled = false;
    b.textContent = t('reload');
    if (ok) flashT('ok', 'reload'); else flashT('bad', 'offline');
    autoPlanen();
  });
};
$('lang').onclick = function () { lang = lang === 'zh' ? 'de' : 'zh'; ls(K.lang, lang); applyLang(); };

function openSetup(on) {
  imSetup = !!on;
  show($('setup'), on); show($('app'), !on);
  if (!on) return;
  $('cfgCode').value = '';
  show($('pairBox'), !cfg.tok);
  show($('doneBox'), !!cfg.tok);
  $('meName').textContent = cfg.who || '';
  $('meRole').textContent = cfg.rolle || (cfg.rw ? '' : t('readonly'));
}

$('gear').onclick = function () {
  if (!cfg.tok) return;
  openSetup(!imSetup);
};

function setPairBusy(on) {
  pairBusy = on;
  var b = $('cfgPair');
  b.disabled = on;
  b.innerHTML = on ? SPINNER : esc(t('save'));
  $('cfgCode').disabled = on;
}

$('cfgPair').onclick = function () {
  if (pairBusy) return;

  var code = $('cfgCode').value.trim().toUpperCase();
  if (!apiOk(cfg.api) || !code) { $('cfgMsg').textContent = t('pairFail'); return; }
  $('cfgMsg').textContent = '';
  setPairBusy(true);

  var frist = setTimeout(function () {
    if (!pairBusy) return;
    setPairBusy(false);
    $('cfgMsg').textContent = t('pairFail');
  }, 30000);
  apiPost('pair', { code:code }).then(function (d) {
    clearTimeout(frist);
    setPairBusy(false);

    if (!d.ok) { $('cfgMsg').textContent = t('pairFail'); return; }
    cfg.tok = d.token; cfg.who = d.who; cfg.rw = !!d.rw;
    cfg.rolle = d.role || ''; cfg.rechte = d.rechte || null;
    ls(K.cfg, cfg);
    boot();
  }).catch(function () {
    clearTimeout(frist);
    setPairBusy(false);
    $('cfgMsg').textContent = t('pairFail');
  });
};

$('cfgUnpair').onclick = function () {
  cfg.tok = ''; cfg.who = ''; cfg.rolle = ''; cfg.rechte = null; ls(K.cfg, cfg);
  openSetup(true);
};

$('cfgCode').oninput = function () {
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
};

lang = ls(K.lang) || ((navigator.language || '').slice(0, 2) === 'zh' ? 'zh' : 'de');
function boot() {
  $('who').textContent = cfg.who || '';
  openSetup(false);
  meldung = { kind:'', key:'ready', a:'', b:'', bKey:'' };
  applyLang(); reiterRichten(); reindex(); queueShow();

  werBinIch().then(function () {
    reiterRichten();
    return darf('sync') ? sync() : null;
  }).then(flush).then(function () { autoPlanen(); });
}

function werBinIch() {
  return mitFrist(apiGet('whoami'), 10000).then(function (d) {
    if (!d || !d.ok) return;
    cfg.rolle = d.role || ''; cfg.rechte = d.rechte || null;
    if (d.who) cfg.who = d.who;
    ls(K.cfg, cfg);
    $('who').textContent = cfg.who || '';
  }).catch(function () {});
}
if (cfg.api && cfg.tok) {
  boot();
} else {
  openSetup(true);
  applyLang();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
